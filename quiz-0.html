<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אימון מסה ונפח | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial;direction:rtl}header{background:#162e67;color:white;padding:19px 5%;display:flex;justify-content:space-between}header a{color:white}main{max-width:850px;margin:30px auto;padding:0 15px}.panel{background:white;border-radius:22px;padding:25px;box-shadow:0 8px 30px #172f6512;margin:18px 0}.btn{display:inline-block;padding:13px 19px;border:0;border-radius:12px;background:#315bd7;color:white;text-decoration:none;font:inherit;cursor:pointer}.answer{display:block;width:100%;text-align:right;background:#f7faff;border:2px solid #dce5f5;padding:15px;border-radius:12px;font:inherit;margin:9px 0;cursor:pointer}.good{background:#e7fff1;border-color:#15935c}.bad{background:#fff0f0;border-color:#c74040}.muted{color:#66758b}.progress{height:9px;background:#e4eaf6;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#315bd7}.hidden{display:none}.fox-mascot{position:fixed;left:10px;bottom:8px;z-index:1200;width:min(230px,35vw);opacity:0;transform:translate(-25px,30px) scale(.82);pointer-events:none;transition:opacity .22s ease,transform .34s cubic-bezier(.2,.9,.3,1.28)}.fox-mascot.show{opacity:1;transform:translate(0,0) scale(1)}.fox-mascot img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 18px #17294d2e)}.fox-mascot.happy:after{content:"";position:absolute;left:57%;top:10%;width:8%;height:7%;background:#fff3cf;border-radius:50%;transform:rotate(-8deg)}@media(max-width:600px){.panel{padding:17px}.fox-mascot{width:155px;left:4px;bottom:4px}}</style></head><body><header><strong>🎓 StudyAI</strong><a href="index.html">בית</a></header><main><section class="panel"><h1>⚖️🧪 אימון מסה ונפח – כיתה ז׳</h1><p class="muted">20 שאלות שונות • מסה ונפח • תשובה אחת בכל פעם • הסברים וציון</p><div class="progress"><div id="bar" style="width:5%"></div></div><div id="game"><p id="counter"></p><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="hidden" aria-live="polite"></div><button id="next" class="btn hidden" type="button">לשאלה הבאה ←</button></div><div id="result" class="hidden"></div></section></main><div id="foxMascot" class="fox-mascot"><img id="foxImg" alt="שועל StudyAI"></div><script>const questions=[["מהי מסה?",["כמות החומר בגוף","המקום שגוף תופס","הטמפרטורה של הגוף","הצורה של הגוף"],0,"מסה היא מדד לכמות החומר בגוף."],["באיזה מכשיר מודדים מסה?",["משורה","מאזניים","סרגל","מדחום"],1,"מאזניים משמשים למדידת מסה."],["כמה גרמים יש בקילוגרם אחד?",["10","100","1,000","10,000"],2,"קילוגרם אחד שווה ל־1,000 גרם."],["כמה קילוגרמים הם 2,500 גרם?",["0.25","2.5","25","250"],1,"מחלקים ב־1,000: 2,500 גרם הם 2.5 קילוגרם."],["כוס ריקה מסתה 120 גרם וכוס עם מים מסתה 370 גרם. מה מסת המים?",["120 גרם","250 גרם","370 גרם","490 גרם"],1,"מחסרים את מסת הכוס: 370 פחות 120 שווה 250 גרם."],["מה יקרה למסה של אבן אם נעביר אותה מכדור הארץ לירח?",["תקטן","תגדל","לא תשתנה","תתאפס"],2,"המסה נשארת קבועה גם אם כוח הכבידה משתנה."],["מהי המסה של 0.75 קילוגרם בגרמים?",["75","750","7,500","0.75"],1,"0.75 כפול 1,000 שווה 750 גרם."],["שלושה גופים, כל אחד במסה של 200 גרם. מה המסה הכוללת?",["400 גרם","600 גרם","800 גרם","1,000 גרם"],1,"3 כפול 200 שווה 600 גרם."],["מה פירוש איפוס TARE במאזניים דיגיטליים?",["מדידת טמפרטורה","איפוס הקריאה כדי לא לכלול את מסת הכלי","המרת גרמים לליטרים","הגדלת המסה"],1,"איפוס מאפשר למדוד רק את מסת התכולה בלי הכלי."],["אם מוסיפים 200 גרם חול לקופסה שמסתה 800 גרם, מה תהיה המסה החדשה?",["600 גרם","800 גרם","900 גרם","1,000 גרם"],3,"800 ועוד 200 שווה 1,000 גרם."],["מהו נפח?",["כמות החומר בגוף","המקום שגוף תופס במרחב","המשקל של הגוף","הטמפרטורה של הגוף"],1,"נפח הוא המקום שגוף תופס במרחב."],["באיזה כלי מודדים בדרך כלל נפח של נוזל?",["מאזניים","מדחום","משורה","שעון"],2,"משורה משמשת למדידת נפח של נוזלים."],["איזו יחידה מתאימה למדידת נפח נוזל?",["גרם","מיליליטר","קילוגרם","ניוטון"],1,"מיליליטר היא יחידת נפח נפוצה לנוזלים."],["כמה מיליליטר יש בליטר אחד?",["10","100","1,000","10,000"],2,"ליטר אחד שווה ל־1,000 מיליליטר."],["כמה ליטרים הם 1,500 מיליליטר?",["0.15","1.5","15","150"],1,"1,500 מיליליטר הם 1.5 ליטר."],["במשורה היו 40 מ״ל מים. לאחר הכנסת אבן מפלס המים עלה ל־65 מ״ל. מה נפח האבן?",["25 מ״ל","40 מ״ל","65 מ״ל","105 מ״ל"],0,"נפח האבן הוא ההפרש: 65 פחות 40 שווה 25 מ״ל."],["מה שווה בערך ל־1 מ״ל?",["1 סמ״ק","10 סמ״ק","100 סמ״ק","1 ליטר"],0,"1 מיליליטר שווה ל־1 סנטימטר מעוקב."],["איך מחשבים נפח של תיבה מלבנית?",["אורך ועוד רוחב ועוד גובה","אורך כפול רוחב כפול גובה","אורך כפול גובה בלבד","רוחב חלקי גובה"],1,"נפח תיבה מחושב באמצעות אורך כפול רוחב כפול גובה."],["לתיבה אורך 4 ס״מ, רוחב 3 ס״מ וגובה 2 ס״מ. מה נפחה?",["9 סמ״ק","12 סמ״ק","24 סמ״ק","36 סמ״ק"],2,"4 כפול 3 כפול 2 שווה 24 סמ״ק."],["שני כלים מכילים כל אחד 500 מ״ל מים. מה נפח המים הכולל?",["250 מ״ל","500 מ״ל","750 מ״ל","1,000 מ״ל"],3,"500 ועוד 500 שווה 1,000 מ״ל, כלומר ליטר אחד."]];let pos=0,score=0,selected=false;const $=id=>document.getElementById(id);function hideFox(){const f=$('foxMascot');f.classList.remove('show','happy','sad')}function show(){hideFox();selected=false;const q=questions[pos];$('counter').textContent='שאלה '+(pos+1)+' מתוך '+questions.length+' | ניקוד: '+score*5;$('question').textContent=q[0];$('bar').style.width=((pos+1)/questions.length*100)+'%';$('answers').innerHTML='';$('feedback').classList.add('hidden');$('next').classList.add('hidden');q[1].forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=['א. ','ב. ','ג. ','ד. '][i]+a;b.onclick=()=>choose(i);$('answers').appendChild(b)})}function showFox(ok){const f=$('foxMascot');$('foxImg').src=ok?'assets/fox-happy.svg':'assets/fox-sad.svg';f.classList.add(ok?'happy':'sad','show')}function choose(i){if(selected)return;selected=true;const q=questions[pos],ok=i===q[2];if(ok)score++;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('good');else if(j===i)b.classList.add('bad')});$('feedback').classList.remove('hidden');$('feedback').innerHTML='<p><strong>'+(ok?'כל הכבוד! תשובה נכונה 🎉':'לא נורא. התשובה הנכונה: '+q[1][q[2]])+'</strong></p><p>'+q[3]+'</p>';$('next').classList.remove('hidden');$('next').textContent=pos===questions.length-1?'הצג ציון סופי':'לשאלה הבאה ←';showFox(ok)}$('next').onclick=()=>{pos++;if(pos<questions.length)show();else{hideFox();$('game').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('result').innerHTML='<h2>🏆 סיימת!</h2><h1>הציון שלך: '+score*5+'/100</h1><p>ענית נכון על '+score+' מתוך 20 שאלות.</p><button class="btn" onclick="location.reload()">אימון חוזר</button> <a class="btn" href="science.html">חזרה לנושאים</a>'}};show();</script></body></html>
