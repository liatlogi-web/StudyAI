<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אימון מסה | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial;direction:rtl}header{background:#162e67;color:white;padding:19px 5%;display:flex;justify-content:space-between}header a{color:white}main{max-width:850px;margin:30px auto;padding:0 15px}.panel{background:white;border-radius:22px;padding:25px;box-shadow:0 8px 30px #172f6512;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{display:block;padding:24px 12px;border:2px solid #dce5f5;background:#f8faff;border-radius:15px;text-decoration:none;color:#1b2d49;font-weight:700;text-align:center}.tile span{display:block;font-size:30px}.btn{display:inline-block;padding:13px 19px;border:0;border-radius:12px;background:#315bd7;color:white;text-decoration:none;font:inherit;cursor:pointer}.answer{display:block;width:100%;text-align:right;background:#f7faff;border:2px solid #dce5f5;padding:15px;border-radius:12px;font:inherit;margin:9px 0;cursor:pointer}.good{background:#e7fff1;border-color:#15935c}.bad{background:#fff0f0;border-color:#c74040}.muted{color:#66758b}.progress{height:9px;background:#e4eaf6;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#315bd7}.hidden{display:none}@media(max-width:450px){.panel{padding:17px}}</style></head><body><header><strong>🎓 StudyAI</strong><a href="index.html">בית</a></header><main><section class="panel"><h1>⚖️ אימון מסה – כיתה ז׳</h1><p class="muted">20 שאלות שונות • תשובה אחת בכל פעם • הסברים וציון</p><div class="progress"><div id="bar" style="width:5%"></div></div><div id="game"><p id="counter"></p><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="hidden" aria-live="polite"></div><button id="next" class="btn hidden" type="button">לשאלה הבאה ←</button></div><div id="result" class="hidden"></div></section><script>const questions=[["מהי מסה?",["כמות החומר בגוף","השטח של גוף","המקום שגוף תופס","הכוח שמושך גוף מטה"],0,"מסה היא מדד לכמות החומר בגוף."],["באיזה מכשיר מודדים מסה?",["משורה","מאזניים","סרגל","מדחום"],1,"מאזניים מודדים מסה; משורה מודדת נפח."],["איזו יחידה משמשת למדידת מסה?",["מיליליטר","מטר","קילוגרם","ניוטון"],2,"קילוגרם וגרם הן יחידות מסה."],["כמה גרמים יש ב־1 קילוגרם?",["100","10","10,000","1,000"],3,"קילוגרם אחד שווה ל־1,000 גרם."],["כמה קילוגרמים הם 2,500 גרם?",["25","2.5","0.25","250"],1,"מחלקים ב־1,000: 2,500 גרם הם 2.5 קילוגרם."],["מהי המסה הכוללת של 350 גרם ועוד 150 גרם?",["500 גרם","400 גרם","200 גרם","600 גרם"],0,"350 ועוד 150 שווים 500 גרם."],["מה יקרה למסה של אבן אם נעביר אותה מכדור הארץ לירח?",["היא תקטן פי שישה","היא תגדל","היא לא תשתנה","היא תתאפס"],2,"המסה נשארת קבועה; המשקל משתנה עם כוח הכבידה."],["מה מודדים ביחידת ניוטון?",["מסה","נפח","צפיפות","משקל ככוח"],3,"ניוטון הוא יחידת כוח, ומשקל הוא כוח הכבידה על הגוף."],["שתי קופסאות זהות: באחת חול ובשנייה צמר גפן. מה אפשר להסיק על המסות?",["הן חייבות להיות שוות","הן עשויות להיות שונות","לצמר גפן תמיד מסה גדולה יותר","אין לאף אחת מסה"],1,"נפח דומה אינו מחייב מסה שווה; החומרים שונים."],["מהי המסה של 0.75 קילוגרם בגרמים?",["750","75","7,500","0.75"],0,"0.75 כפול 1,000 שווה 750 גרם."],["גוף שמסתו 1.2 ק״ג וגוף שמסתו 900 גרם: למי מסה גדולה יותר?",["לגוף של 900 גרם","לשניהם אותה מסה","לגוף של 1.2 ק״ג","אי אפשר להשוות"],2,"1.2 קילוגרם הם 1,200 גרם, יותר מ־900 גרם."],["כוס ריקה מסתה 120 גרם, וכוס עם מים מסתה 370 גרם. מה מסת המים?",["490 גרם","370 גרם","120 גרם","250 גרם"],3,"מחסרים את מסת הכוס: 370 פחות 120 שווה 250 גרם."],["מהי משמעות פעולת איפוס (TARE) במאזניים דיגיטליים?",["הגדלת המסה","איפוס הקריאה עם כלי המדידה עליו","המרת גרמים לליטרים","מדידת טמפרטורה"],1,"איפוס עם הכלי מאפשר למדוד רק את מסת התכולה."],["מה קורה למסה הכוללת כאשר קרח נמס למים בלי שחומר יוצא או נכנס?",["היא נשארת קבועה","היא מוכפלת","היא קטנה בחצי","היא נעלמת"],0,"בהתכה משתנה מצב הצבירה, אך כמות החומר נשמרת."],["מהי מסתם של שלושה גופים שכל אחד מהם 200 גרם?",["400 גרם","800 גרם","600 גרם","200 גרם"],2,"שלוש פעמים 200 שווה 600 גרם."],["איזו מסה היא הקטנה ביותר?",["0.9 ק״ג","950 גרם","1,050 גרם","800 גרם"],3,"800 גרם קטנים מ־900, 950 ו־1,050 גרם."],["על מאזניים מאוזנים מונח גוף בצד אחד ומשקולות של 50 גרם ו־20 גרם בצד השני. מה מסת הגוף?",["30 גרם","70 גרם","100 גרם","20 גרם"],1,"במאזני כפות מאוזנים המסות שוות: 50 ועוד 20 הם 70 גרם."],["מהי המסה של 3 קילוגרם ו־250 גרם בגרמים?",["3,250","325","3,025","250"],0,"3 קילוגרם הם 3,000 גרם, ועוד 250 הם 3,250 גרם."],["איזה משפט מתאר נכון את ההבדל בין מסה לנפח?",["שניהם נמדדים בקילוגרמים","נפח הוא כוח","מסה מתארת כמות חומר ונפח מתאר מקום תפוס","מסה ונפח תמיד שווים"],2,"מסה מתארת כמות חומר; נפח מתאר את המקום שגוף תופס."],["אם מוסיפים 200 גרם חול לקופסה שמסתה הכוללת הייתה 800 גרם, מה תהיה המסה הכוללת לאחר ההוספה?",["600 גרם","800 גרם","900 גרם","1,000 גרם"],3,"800 ועוד 200 שווה 1,000 גרם, בהנחה שלא הוצא חומר."]];let pos=0,score=0,selected=false;const $=id=>document.getElementById(id);function show(){selected=false;const q=questions[pos];$('counter').textContent='שאלה '+(pos+1)+' מתוך '+questions.length+' | ניקוד: '+score*5;$('question').textContent=q[0];$('bar').style.width=((pos+1)/questions.length*100)+'%';$('answers').innerHTML='';$('feedback').classList.add('hidden');$('next').classList.add('hidden');q[1].forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=['א. ','ב. ','ג. ','ד. '][i]+a;b.onclick=()=>choose(i);$('answers').appendChild(b)})}function choose(i){if(selected)return;selected=true;const q=questions[pos];if(i===q[2])score++;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('good');else if(j===i)b.classList.add('bad')});$('feedback').classList.remove('hidden');$('feedback').innerHTML='<p><strong>'+(i===q[2]?'כל הכבוד! תשובה נכונה 🎉':'כמעט! התשובה הנכונה: '+q[1][q[2]])+'</strong></p><p>'+q[3]+'</p>';$('next').classList.remove('hidden');$('next').textContent=pos===questions.length-1?'הצג ציון סופי':'לשאלה הבאה ←'}$('next').onclick=()=>{pos++;if(pos<questions.length)show();else{$('game').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('result').innerHTML='<h2>🏆 סיימת!</h2><h1>הציון שלך: '+score*5+'/100</h1><p>ענית נכון על '+score+' מתוך 20 שאלות.</p><button class="btn" onclick="location.reload()">אימון חוזר</button> <a class="btn" href="science.html">חזרה לנושאים</a>'}};show();</script></main></body></html>
