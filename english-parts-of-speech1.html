<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Parts of Speech — מבחן 1 באנגלית | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial}.back{position:fixed;left:12px;top:12px;z-index:3000;background:#fff;color:#162e67;text-decoration:none;padding:11px 14px;border-radius:13px;font-weight:900;box-shadow:0 5px 18px #10265026;border:2px solid #dce5f5}header{background:#162e67;color:#fff;padding:20px 5%;text-align:center}main{max-width:900px;margin:24px auto;padding:0 14px}.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #172f6512}.question{font-size:23px;font-weight:900;margin:10px 0 18px}.sentence{font-size:25px;direction:ltr;font-weight:800;color:#183d91;margin:12px 0 20px;line-height:1.5}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.answer{font:inherit;padding:15px;border-radius:14px;border:2px solid #dce5f5;background:#f8faff;font-weight:800;cursor:pointer}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.status{font-weight:900;min-height:30px;margin:15px 0}.next{display:none;margin:auto;background:#315bd7;color:#fff;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:900}.muted{color:#66758b}.progress{height:10px;background:#e4eaf6;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:#315bd7;width:0}.help{background:#eef3ff;padding:12px 14px;border-radius:14px;margin-bottom:18px;line-height:1.7;font-weight:800}.scorebig{font-size:38px;font-weight:900;color:#183d91}@media(max-width:650px){.answers{grid-template-columns:1fr}.back{font-size:12px;padding:8px 9px}.sentence{font-size:21px}.panel{padding:18px}}</style></head><body><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a><header><strong>🔤 Parts of Speech — תרגול מלא</strong></header><main><section class="panel"><div class="help">Noun = שם עצם · Verb = פועל · Adjective = שם תואר</div><p class="muted" id="counter"></p><div class="progress"><div id="bar"></div></div><div class="question">איזה חלק דיבר היא המילה המודגשת?</div><div id="sentence" class="sentence"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">שאלה הבאה ←</button></section></main><script>const qs=[['The <b>dog</b> is sleeping.','Noun'],['She <b>runs</b> every morning.','Verb'],['It is a <b>beautiful</b> day.','Adjective'],['My brother is very <b>tall</b>.','Adjective'],['We <b>study</b> English at school.','Verb'],['Dana opened the <b>window</b>.','Noun'],['The <b>small</b> village is near the river.','Adjective'],['We <b>received</b> a letter yesterday.','Verb'],['The <b>team</b> won the game.','Noun'],['The test was <b>difficult</b>.','Adjective'],['My parents <b>work</b> in Tel Aviv.','Verb'],['The <b>teacher</b> wrote on the board.','Noun'],['This is an <b>interesting</b> book.','Adjective'],['They <b>joined</b> the club last week.','Verb'],['Our <b>school</b> is very big.','Noun'],['The <b>river</b> is wide.','Noun'],['Maya <b>prefers</b> chocolate ice cream.','Verb'],['The old bridge is <b>dangerous</b>.','Adjective'],['The <b>guide</b> showed us the village.','Noun'],['They <b>opened</b> the door.','Verb'],['It was an <b>amazing</b> journey.','Adjective'],['The <b>mountain</b> is very high.','Noun'],['We <b>continue</b> our trip tomorrow.','Verb'],['The meal was <b>lovely</b>.','Adjective'],['The <b>office</b> is next to the theater.','Noun'],['They <b>filled</b> in the form.','Verb'],['This is the <b>main</b> road.','Adjective'],['Our <b>club</b> meets every Friday.','Noun'],['I <b>imagine</b> a different ending.','Verb'],['The weather is <b>warm</b>.','Adjective']];const types=['Noun','Verb','Adjective'];let order=[...qs.keys()].sort(()=>Math.random()-.5),pos=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(){locked=false;$('status').textContent='';$('next').style.display='none';const q=qs[order[pos]];$('counter').textContent='שאלה '+(pos+1)+' מתוך '+qs.length+' | ניקוד: '+score;$('bar').style.width=((pos+1)/qs.length*100)+'%';$('sentence').innerHTML=q[0];let opts=[...types].sort(()=>Math.random()-.5);$('answers').innerHTML='';opts.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=['א. ','ב. ','ג. '][i]+o;b.onclick=()=>{if(locked)return;locked=true;[...$('answers').children].forEach((x,j)=>{if(opts[j]===q[1])x.classList.add('good')});if(o===q[1]){score++;b.classList.add('good');$('status').textContent='כל הכבוד!'}else{b.classList.add('bad');$('status').textContent='לא נכון. התשובה הנכונה: '+q[1]}$('next').style.display='block'};$('answers').appendChild(b)})}$('next').onclick=()=>{pos++;if(pos<qs.length)show();else{const pct=Math.round(score/qs.length*100);$('sentence').innerHTML='<div class="scorebig">'+pct+'/100</div><div>סיימת את כל '+qs.length+' השאלות!</div>';$('answers').innerHTML='';$('status').textContent='ענית נכון על '+score+' מתוך '+qs.length;$('next').textContent='אימון חדש';$('next').style.display='block';$('next').onclick=()=>location.reload()}};show();</script><script src="exam-timer.js"></script></body></html>
