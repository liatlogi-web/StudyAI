];qs.push(...readSet.qs.map(q=>({cat:'קטע קריאה',q:q[0],he:q[3],p:'',a:q[1],c:q[2],read:true,ltr:true})));for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}let pos=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(){locked=false;const x=qs[pos];$('badge').textContent=x.cat;$('counter').textContent='שאלה '+(pos+1)+' מתוך '+qs.length+' | ניקוד: '+score;$('bar').style.width=((pos+1)/qs.length*100)+'%';$('status').textContent='';$('next').style.display='none';$('question').textContent=x.q+(x.he?'  |  '+x.he:'');$('prompt').innerHTML=x.p||'';$('passageWrap').innerHTML=x.read?'<div class="passage"></div><details style="padding:10px;background:#edf6ff;border-radius:12px;margin-bottom:15px"><summary>מילים שיעזרו לי</summary><div id="mixedGloss"></div></details>':'';if(x.read){$('passageWrap').querySelector('.passage').textContent=reading;$('mixedGloss').textContent=Object.entries(readSet.glossary).map(([a,b])=>a+' = '+b).join(' • ')}$('answers').innerHTML='';x.a.forEach((o,i)=>{const b=document.createElement('button');b.className='answer'+(x.ltr?' ltr':'');b.textContent=['א. ','ב. ','ג. ','ד. '][i]+o;b.onclick=()=>{if(locked)return;locked=true;[...$('answers').children].forEach((z,j)=>{if(j===x.c)z.classList.add('good')});if(i===x.c){score++;b.classList.add('good');$('status').textContent='כל הכבוד! תשובה נכונה'}else{b.classList.add('bad');$('status').textContent='לא נכון. התשובה הנכונה היא: '+x.a[x.c]}$('next').style.display='block'};$('answers').appendChild(b)})} $('next').onclick=()=>{pos++;if(pos<qs.length)show();else{const pct=Math.round(score/qs.length*100);document.querySelector('main').innerHTML='<section class="panel" style="text-align:center"><h2>סיימת את התרגול המעורבב</h2><div class="scorebig">'+pct+'/100</div><p>ענית נכון על '+score+' מתוך '+qs.length+' שאלות.</p><button class="next" style="display:inline-block" onclick="location.reload()">אימון חדש</button></section>'}};show();</script
