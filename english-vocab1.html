t.add('good');$('status').textContent='כל הכבוד! תשובה נכונה'}else{b.classList.add('bad');$('status').textContent='לא נכון. התשובה הנכונה: '+(isEn?w[1]:w[0])}$('next').style.display='block'};$('answers').appendChild(b)})}$('next').onclick=()=>{pos++;if(pos<questions.length)render();else{$('quiz').hidden=true;$('finish').hidden=false;const pct=Math.round(score/questions.length*100);$('finish').innerHTML='<h2>סיימת את כל המילים!</h2><h1>'+pct+'/100</h1><p>ענית נכון על '+score+' מתוך '+questions.length+' שאלות.</p><a class="restart" href="english-vocab1.html?v=5">אימון חדש</a>'}};render();</script><script src="exam-timer.js"></script></body></html>
