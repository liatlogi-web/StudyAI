<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אוצר מילים — מבחן 1 באנגלית | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial}header{background:#162e67;color:white;padding:17px 4%;display:flex;justify-content:space-between;align-items:center;gap:10px}.back{background:#fff;color:#162e67;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:800;white-space:nowrap}main{max-width:1000px;margin:24px auto;padding:0 14px}.panel{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 30px #172f6512;margin:16px 0}.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.word{border:2px solid #e0e7f6;background:#f8faff;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:4px}.word b{font-size:20px;color:#183d91}.word small{color:#7a8799}.quiz{text-align:center}.qword{font-size:38px;font-weight:900;direction:ltr;margin:12px 0 18px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{font:inherit;border:2px solid #dce5f5;background:#f8faff;padding:14px;border-radius:12px;cursor:pointer;font-weight:700}button.good{background:#e7fff1;border-color:#15935c}button.bad{background:#fff0f0;border-color:#c74040}.status{margin:14px 0;font-weight:800}.next{background:#315bd7;color:white;border:0;display:none;margin:auto}@media(max-width:700px){.words{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}}@media(max-width:440px){.words{grid-template-columns:1fr}.back{font-size:14px;padding:9px 11px}header strong{font-size:15px}}</style></head><body><header><strong>🧠 אוצר מילים — מבחן 1 באנגלית</strong><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a></header><main><section class="panel"><h1>המילים למבחן</h1><p>עמודים 12, 20 ו־28 בספר Teamwork.</p><div id="words" class="words"></div></section><section class="panel quiz"><h2>תרגול אוצר מילים</h2><p id="counter"></p><div id="qword" class="qword"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">שאלה הבאה</button></section></main><script>const words=[['activity','פעילות','12'],['bridge','גשר','12'],['choice','בחירה, ברירה','12'],['danger','סכנה','12'],['journey','מסע','12'],['mountain','הר','12'],['river','נהר','12'],['village','כפר','12'],['continue','להמשיך','12'],['depend on','להסתמך על','12'],['fix','לתקן','12'],['imagine','לדמיין, להאמין','12'],['prefer','להעדיף','12'],['realize','להבין, לקלוט','12'],['careful','זהיר','12'],['dangerous','מסוכן','12'],['possible','אפשרי','12'],['unusual','יוצא דופן','12'],['usual','רגיל','12'],['wide','רחב','12'],['across','מעבר, לרוחב','12'],['any','איזשהו, כל','12'],['anybody','כל אחד, מישהו','12'],['directly','ישירות','12'],['next to','ליד','12'],['bowl','קערה','20'],['guide','מדריך','20'],['history','היסטוריה','20'],['job','עבודה','20'],['lemon','לימון','20'],['meal','ארוחה','20'],['nation','אומה','20'],['oil','שמן, דלק','20'],['pepper','פלפל','20'],['salt','מלח','20'],['world','עולם','20'],['amaze','להדהים','20'],['fall in love','להתאהב','20'],['feed','להאכיל','20'],['follow','ללכת בעקבות','20'],['open','לפתוח','20'],['receive','לקבל','20'],['serve','לשרת, להגיש','20'],['shake hands','ללחוץ ידיים','20'],['welcome','לקבל בברכה, להגיד שלום','20'],['amazing','מדהים','20'],['certain','בטוח','20'],['lovely','נעים, נחמד','20'],['main','עיקרי','20'],['typical','טיפוסי, אופייני, רגיל','20'],['warm','חם','20'],['according to','לפי','20'],['band','להקה','28'],['club','מועדון','28'],['form','טופס','28'],['list','רשימה','28'],['office','משרד','28'],['team','קבוצה','28'],['theater','תיאטרון','28'],['variety','מגוון','28'],['writing','כתיבה','28'],['fill in','למלא','28'],['join','להצטרף','28'],['interested in','מעוניין ב־','28'],['around here','כאן בסביבה','28'],["I'd love to",'אשמח ל־','28'],['Nice to meet you','נעים להכיר','28'],['What about ...?','מה לגבי...?','28'],['Would you like ...?','האם תרצה...?','28']];document.getElementById('words').innerHTML=words.map(w=>`<div class="word"><b dir="ltr">${w[0]}</b><span>${w[1]}</span><small>עמוד ${w[2]}</small></div>`).join('');let order=[...words.keys()].sort(()=>Math.random()-.5),pos=0,score=0,locked=false;const $=x=>document.getElementById(x);function show(){locked=false;$('status').textContent='';$('next').style.display='none';let i=order[pos],w=words[i];$('counter').textContent='שאלה '+(pos+1)+' מתוך '+words.length+' | ניקוד: '+score;$('qword').textContent=w[0];let wrong=words.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3),opts=[w,...wrong].sort(()=>Math.random()-.5);$('answers').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.textContent=o[1];b.onclick=()=>{if(locked)return;locked=true;[...$('answers').children].forEach(x=>{if(x.textContent===w[1])x.classList.add('good')});if(o===w){score++;b.classList.add('good');$('status').textContent='כל הכבוד!'}else{b.classList.add('bad');$('status').textContent='לא נכון. הפירוש הנכון: '+w[1]}$('next').style.display='block'};$('answers').appendChild(b)})}$('next').onclick=()=>{pos++;if(pos<order.length)show();else{$('qword').textContent='סיימת!';$('answers').innerHTML='';$('status').textContent='ענית נכון על '+score+' מתוך '+words.length;$('next').textContent='אימון חדש';$('next').style.display='block';$('next').onclick=()=>location.reload()}};show();</script><script src="exam-timer.js"></script></body></html>
