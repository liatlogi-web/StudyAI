<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>אוצר מילים — מבחן 1 באנגלית | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial}.top{background:#162e67;color:#fff;min-height:68px;display:flex;align-items:center;justify-content:center;padding:14px 175px 14px 20px;position:relative}.top strong{font-size:20px}.back{position:absolute;left:12px;top:12px;background:#fff;color:#162e67;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:900;border:2px solid #dce5f5;white-space:nowrap}main{max-width:980px;margin:16px auto 40px;padding:0 12px}.panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #172f6512;margin-bottom:18px}.quiz{text-align:center}.counter{font-weight:800;color:#66758b;margin:0 0 10px}.progress{height:10px;background:#e5eaf4;border-radius:20px;overflow:hidden;margin:0 0 18px}.progress>div{height:100%;background:#315bd7;width:0}.question-label{font-size:26px;font-weight:900;margin:8px 0}.qword{font-size:50px;font-weight:950;color:#183d91;margin:8px 0 22px}.qword.en{direction:ltr}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{font:inherit;border:2px solid #dce5f5;background:#f8faff;padding:17px;border-radius:15px;cursor:pointer;font-weight:850;min-height:62px}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.status{min-height:32px;margin:16px 0 6px;font-weight:900}.next{display:none;margin:10px auto 0;border:0;background:#315bd7;color:#fff;padding:12px 20px;border-radius:12px;font:inherit;font-weight:900}.finish{text-align:center}.restart{display:inline-block;background:#315bd7;color:#fff;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:900}.words-title{margin:0 0 14px}.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.word{border:2px solid #e0e7f6;background:#f8faff;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:4px}.word b{font-size:20px;color:#183d91;direction:ltr}.word small{color:#7a8799}@media(max-width:700px){.top{padding-right:130px}.top strong{font-size:15px}.back{font-size:12px;padding:8px 9px;left:6px;top:10px}.panel{padding:16px}.answers{grid-template-columns:1fr}.qword{font-size:39px;margin-bottom:14px}.question-label{font-size:21px}.answer{min-height:54px;padding:13px}.words{grid-template-columns:1fr 1fr}}@media(max-width:440px){.words{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a><strong>🧠 אוצר מילים</strong></header><main><section class="panel"><div id="quiz" class="quiz"><p id="counter" class="counter"></p><div class="progress"><div id="bar"></div></div><div id="questionLabel" class="question-label"></div><div id="qword" class="qword"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">לשאלה הבאה ←</button></div><div id="finish" class="finish" hidden></div></section><section class="panel"><h2 class="words-title">המילים והתרגומים</h2><div id="wordsList" class="words"></div></section></main><script>const words=[['activity','פעילות','12'],['bridge','גשר','12'],['choice','בחירה, ברירה','12'],['danger','סכנה','12'],['journey','מסע','12'],['mountain','הר','12'],['river','נהר','12'],['village','כפר','12'],['continue','להמשיך','12'],['depend on','להסתמך על','12'],['fix','לתקן','12'],['imagine','לדמיין, להאמין','12'],['prefer','להעדיף','12'],['realize','להבין, לקלוט','12'],['careful','זהיר','12'],['dangerous','מסוכן','12'],['possible','אפשרי','12'],['unusual','יוצא דופן','12'],['usual','רגיל','12'],['wide','רחב','12'],['across','מעבר, לרוחב','12'],['any','איזשהו, כל','12'],['anybody','כל אחד, מישהו','12'],['directly','ישירות','12'],['next to','ליד','12'],['bowl','קערה','20'],['guide','מדריך','20'],['history','היסטוריה','20'],['job','עבודה','20'],['lemon','לימון','20'],['meal','ארוחה','20'],['nation','אומה','20'],['oil','שמן, דלק','20'],['pepper','פלפל','20'],['salt','מלח','20'],['world','עולם','20'],['amaze','להדהים','20'],['fall in love','להתאהב','20'],['feed','להאכיל','20'],['follow','ללכת בעקבות','20'],['open','לפתוח','20'],['receive','לקבל','20'],['serve','לשרת, להגיש','20'],['shake hands','ללחוץ ידיים','20'],['welcome','לקבל בברכה, להגיד שלום','20'],['amazing','מדהים','20'],['certain','בטוח','20'],['lovely','נעים, נחמד','20'],['main','עיקרי','20'],['typical','טיפוסי, אופייני, רגיל','20'],['warm','חם','20'],['according to','לפי','20'],['band','להקה','28'],['club','מועדון','28'],['form','טופס','28'],['list','רשימה','28'],['office','משרד','28'],['team','קבוצה','28'],['theater','תיאטרון','28'],['variety','מגוון','28'],['writing','כתיבה','28'],['fill in','למלא','28'],['join','להצטרף','28'],['interested in','מעוניין ב־','28'],['around here','כאן בסביבה','28'],["I'd love to",'אשמח ל־','28'],['Nice to meet you','נעים להכיר','28'],['What about ...?','מה לגבי...?','28'],['Would you like ...?','האם תרצה...?','28']];document.getElementById('wordsList').innerHTML=words.map(w=>`<div class="word"><b>${w[0]}</b><span>${w[1]}</span><small>עמוד ${w[2]}</small></div>`).join('');const progressKey='studyai_vocab_progress_v2_'+(localStorage.getItem('studyai_active_v1')||'guest');
const questions=[];words.forEach((w,i)=>{questions.push({i,dir:'en-he'});questions.push({i,dir:'he-en'})});
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
let pos=0,score=0,locked=false,pending=null;
const $=id=>document.getElementById(id);
function saveProgress(){try{localStorage.setItem(progressKey,JSON.stringify({version:2,order:questions.map(q=>[q.i,q.dir]),pos,score,pending}))}catch(e){}}
function restoreProgress(){try{const p=JSON.parse(localStorage.getItem(progressKey)||'null');if(p&&p.version===2&&Array.isArray(p.order)&&p.order.length===questions.length&&p.order.every(x=>Array.isArray(x)&&Number.isInteger(x[0])&&x[0]>=0&&x[0]<words.length&&(x[1]==='en-he'||x[1]==='he-en'))&&Number.isInteger(p.pos)&&p.pos>=0&&p.pos<questions.length){questions.splice(0,questions.length,...p.order.map(x=>({i:x[0],dir:x[1]})));pos=p.pos;score=Math.min(Math.max(Number(p.score)||0,0),questions.length);pending=p.pending&&typeof p.pending==='object'?p.pending:null;return true}}catch(e){}return false}
if(!restoreProgress()){shuffle(questions);saveProgress()}
const savedLabel=document.createElement('p');savedLabel.id='savedProgressLabel';savedLabel.style.cssText='color:#126d7e;font-weight:800;background:#e8f8fc;padding:10px;border-radius:12px;margin:9px 0';savedLabel.textContent='💾 ההתקדמות נשמרת אוטומטית. כשתחזור, תמשיך מאותה שאלה.';$('quiz').prepend(savedLabel);
function wrongs(c){return shuffle(words.map((_,i)=>i).filter(i=>i!==c)).slice(0,3)}
function markAnswered(correct,pickedIndex){
 locked=true;
 [...$('answers').children].forEach((b,i)=>{b.disabled=true;if(b.dataset.wordIndex===String(correct))b.classList.add('good');if(i===pickedIndex&&b.dataset.wordIndex!==String(correct))b.classList.add('bad')});
 $('status').textContent=pending&&pending.ok?'כל הכבוד! תשובה נכונה':'לא נכון. התשובה הנכונה: '+(questions[pos].dir==='en-he'?words[correct][1]:words[correct][0]);
 $('next').style.display='block'
}
function render(){
 locked=false;$('status').textContent='';$('next').style.display='none';
 const q=questions[pos],w=words[q.i],isEn=q.dir==='en-he';
 $('counter').textContent='שאלה '+(pos+1)+' מתוך '+questions.length+' | ניקוד: '+score;
 $('bar').style.width=((pos+1)/questions.length*100)+'%';
 $('questionLabel').textContent=isEn?'מה הפירוש הנכון של המילה?':'איזו מילה באנגלית מתאימה לפירוש?';
 $('qword').textContent=isEn?w[0]:w[1];$('qword').className='qword'+(isEn?' en':'');
 const ids=shuffle([q.i,...wrongs(q.i)]);
 $('answers').innerHTML='';
 ids.forEach((id,index)=>{
 const b=document.createElement('button');b.className='answer';b.dataset.wordIndex=String(id);
 b.textContent=['א. ','ב. ','ג. ','ד. '][index]+(isEn?words[id][1]:words[id][0]);if(!isEn)b.dir='ltr';
 b.onclick=()=>{
 if(locked)return;locked=true;const ok=id===q.i;
 if(ok)score++;pending={ok,picked:id};saveProgress();
 markAnswered(q.i,index);
 };$('answers').appendChild(b)
 });
 if(pending){const chosenIndex=ids.indexOf(pending.picked);markAnswered(q.i,chosenIndex)}
}
$('next').onclick=()=>{
 pos++;pending=null;
 if(pos<questions.length){saveProgress();render()}
 else{
 try{localStorage.removeItem(progressKey)}catch(e){}
 $('quiz').hidden=true;$('finish').hidden=false;const pct=Math.round(score/questions.length*100);
 $('finish').innerHTML='<h2>סיימת את כל המילים!</h2><h1>'+pct+'/100</h1><p>ענית נכון על '+score+' מתוך '+questions.length+' שאלות.</p><a class="restart" href="english-vocab1.html?v=9">אימון חדש</a>'
 }
};
render();</script><script src="exam-timer.js"></script></body></html>
