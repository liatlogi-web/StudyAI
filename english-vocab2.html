<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תרגול אוצר מילים — מבחן 1 באנגלית | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial}.top{background:#162e67;color:#fff;min-height:72px;display:flex;align-items:center;justify-content:center;padding:16px 170px 16px 20px;position:relative}.top strong{font-size:21px}.back{position:absolute;left:14px;top:14px;background:#fff;color:#162e67;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:900;box-shadow:0 5px 18px #10265026;border:2px solid #dce5f5;white-space:nowrap}main{max-width:820px;margin:16px auto;padding:0 14px}.panel{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px #172f6512}.quiz{text-align:center}.counter{font-weight:800;color:#66758b;margin-top:0}.progress{height:11px;background:#e5eaf4;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:#315bd7;width:0}.question-label{font-size:25px;font-weight:900;margin:5px 0 12px}.qword{font-size:48px;font-weight:950;color:#183d91;margin:10px 0 24px}.qword.en{direction:ltr}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{font:inherit;border:2px solid #dce5f5;background:#f8faff;padding:18px 16px;border-radius:16px;cursor:pointer;font-weight:850;min-height:66px}.answer:hover{border-color:#315bd7}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.status{min-height:34px;margin:18px 0 8px;font-weight:900;font-size:18px}.next{display:none;margin:14px auto 0;border:0;background:#315bd7;color:white;padding:13px 22px;border-radius:13px;font:inherit;font-weight:900;cursor:pointer}.finish h2{font-size:30px}.restart{display:inline-block;background:#315bd7;color:#fff;text-decoration:none;padding:13px 20px;border-radius:12px;font-weight:900}@media(max-width:650px){.top{padding-right:130px}.top strong{font-size:16px}.back{font-size:12px;padding:9px 10px;left:8px;top:12px}.panel{padding:18px}.answers{grid-template-columns:1fr}.qword{font-size:40px}.question-label{font-size:22px}}</style></head><body><header class="top"><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a><strong>🧠 תרגול אוצר מילים</strong></header><main><section class="panel"><div class="quiz" id="quiz"><p id="counter" class="counter"></p><div class="progress"><div id="bar"></div></div><div id="questionLabel" class="question-label"></div><div id="qword" class="qword"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">לשאלה הבאה ←</button></div><div id="finish" class="finish" hidden></div></section></main><script>const words=[['activity','פעילות'],['bridge','גשר'],['choice','בחירה, ברירה'],['danger','סכנה'],['journey','מסע'],['mountain','הר'],['river','נהר'],['village','כפר'],['continue','להמשיך'],['depend on','להסתמך על'],['fix','לתקן'],['imagine','לדמיין, להאמין'],['prefer','להעדיף'],['realize','להבין, לקלוט'],['careful','זהיר'],['dangerous','מסוכן'],['possible','אפשרי'],['unusual','יוצא דופן'],['usual','רגיל'],['wide','רחב'],['across','מעבר, לרוחב'],['any','איזשהו, כל'],['anybody','כל אחד, מישהו'],['directly','ישירות'],['next to','ליד'],['bowl','קערה'],['guide','מדריך'],['history','היסטוריה'],['job','עבודה'],['lemon','לימון'],['meal','ארוחה'],['nation','אומה'],['oil','שמן, דלק'],['pepper','פלפל'],['salt','מלח'],['world','עולם'],['amaze','להדהים'],['fall in love','להתאהב'],['feed','להאכיל'],['follow','ללכת בעקבות'],['open','לפתוח'],['receive','לקבל'],['serve','לשרת, להגיש'],['shake hands','ללחוץ ידיים'],['welcome','לקבל בברכה, להגיד שלום'],['amazing','מדהים'],['certain','בטוח'],['lovely','נעים, נחמד'],['main','עיקרי'],['typical','טיפוסי, אופייני, רגיל'],['warm','חם'],['according to','לפי'],['band','להקה'],['club','מועדון'],['form','טופס'],['list','רשימה'],['office','משרד'],['team','קבוצה'],['theater','תיאטרון'],['variety','מגוון'],['writing','כתיבה'],['fill in','למלא'],['join','להצטרף'],['interested in','מעוניין ב־'],['around here','כאן בסביבה'],["I'd love to",'אשמח ל־'],['Nice to meet you','נעים להכיר'],['What about ...?','מה לגבי...?'],['Would you like ...?','האם תרצה...?']];const questions=[];words.forEach((w,i)=>{questions.push({i,dir:'en-he'});questions.push({i,dir:'he-en'})});for(let i=questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}let pos=0,score=0,locked=false;const $=id=>document.getElementById(id);function pickWrong(correctIndex){const pool=words.map((_,i)=>i).filter(i=>i!==correctIndex);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,3)}function render(){locked=false;$('status').textContent='';$('next').style.display='none';const q=questions[pos],w=words[q.i],isEn=q.dir==='en-he';$('counter').textContent='שאלה '+(pos+1)+' מתוך '+questions.length+' | ניקוד: '+score;$('bar').style.width=((pos+1)/questions.length*100)+'%';$('questionLabel').textContent=isEn?'מה הפירוש הנכון של המילה?':'איזו מילה באנגלית מתאימה לפירוש?';$('qword').textContent=isEn?w[0]:w[1];$('qword').className='qword'+(isEn?' en':'');const ids=[q.i,...pickWrong(q.i)];for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}$('answers').innerHTML='';ids.forEach((id,index)=>{const b=document.createElement('button');b.className='answer';const value=isEn?words[id][1]:words[id][0];b.textContent=['א. ','ב. ','ג. ','ד. '][index]+value;if(!isEn)b.dir='ltr';b.onclick=()=>answer(id,b,isEn,w);$('answers').appendChild(b)})}function answer(id,button,isEn,w){if(locked)return;locked=true;[...$('answers').children].forEach((b,index)=>{const txt=b.textContent.substring(3);const correct=isEn?w[1]:w[0];if(txt===correct)b.classList.add('good')});if(id===questions[pos].i){score++;button.classList.add('good');$('status').textContent='כל הכבוד! תשובה נכונה'}else{button.classList.add('bad');$('status').textContent='לא נכון. התשובה הנכונה: '+(isEn?w[1]:w[0])}$('next').style.display='block'}$('next').onclick=()=>{pos++;if(pos<questions.length){render()}else{finish()}};function finish(){$('quiz').hidden=true;$('finish').hidden=false;$('bar').style.width='100%';const pct=Math.round(score/questions.length*100);$('finish').innerHTML='<h2>סיימת את כל המילים!</h2><h1>'+pct+'/100</h1><p>ענית נכון על '+score+' מתוך '+questions.length+' שאלות.</p><a class="restart" href="english-vocab2.html">אימון חדש</a>'}render();</script><script src="exam-timer.js"></script></body></html>
