<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תרגול מדעים | StudyAI</title><style>*{box-sizing:border-box}body{direction:rtl;font:17px system-ui,Arial;margin:0}header{background:#162e67;color:white;padding:18px 5%;display:flex;justify-content:space-between}header a{color:white}main{max-width:960px;margin:28px auto;padding:0 15px}.panel{background:white;border-radius:22px;padding:25px;margin:15px 0}.muted{color:#66758b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{display:block;background:#fff;border:1px solid #dbe5f5;border-radius:20px;padding:23px 12px;text-align:center;text-decoration:none;color:#183150;font-weight:850}.tile span{display:block;font-size:36px}.tile small{display:block;color:#66758b;margin-top:5px}.btn{display:inline-block;background:#1687ff;color:white;border:0;border-radius:15px;padding:12px 19px;font:inherit;cursor:pointer;text-decoration:none}.answer{display:block;width:100%;border:2px solid #dce5f5;border-radius:15px;background:#f8faff;text-align:right;font:inherit;padding:15px;margin:10px 0;cursor:pointer}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.progress{background:#e4eaf6;height:10px;border-radius:20px;overflow:hidden}.progress div{background:#1687ff;height:100%}.fox{display:none;width:145px;margin:10px auto}.fox.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><header><strong>🎓 StudyAI</strong><a href="index.html">בית</a></header><main><section class="panel"><h1 id="title">תרגול מדעים</h1><p class="muted">שאלה אחת בכל פעם, הסבר אחרי כל תשובה וציון בסוף</p><div class="progress"><div id="bar"></div></div><p id="counter" class="muted"></p><div id="game"><p id="category" style="font-weight:900;color:#1687ff"></p><h2 id="question"></h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><img id="fox" class="fox" alt="שועל StudyAI"><button class="btn" id="next" hidden>לשאלה הבאה ←</button></div><div id="result" hidden></div></section></main><script>
const topics={"body":"גוף וחומר","volume":"נפח ויחידות מידה","mass":"מסה","weight":"מסה ומשקל","all":"הכול מעורבב"},bank=[["body","מהו גוף?",["עצם שתופס מקום ויש לו מסה","יחידת נפח","סוג של כוח","החומר בלבד"],0,"גוף הוא עצם מסוים, למשל כוס."],["body","איזה מהבאים הוא חומר?",["שולחן","בקבוק","זכוכית","כדור"],2,"זכוכית היא חומר; בקבוק הוא גוף."],["body","בקבוק עשוי מפלסטיק. מהו הגוף?",["פלסטיק","בקבוק","צבע","נפח"],1,"הבקבוק הוא הגוף והפלסטיק הוא החומר."],["body","מה נכון לגבי גוף וחומר?",["אותו חומר יכול להרכיב גופים שונים","לכל הגופים אותה מסה","כל גוף עשוי רק מחומר אחד","חומר הוא תמיד גוף מסוים"],0,"למשל חלון וכוס יכולים להיות עשויים מזכוכית."],["body","איזה זוג הוא גוף וחומר בהתאמה?",["עץ — שולחן","סיר — אלומיניום","זכוכית — כוס","מים — בקבוק"],1,"סיר הוא הגוף, אלומיניום הוא החומר."],["body","איזה מהבאים הוא גוף?",["ברזל","עץ כחומר","מסמר","זכוכית"],2,"מסמר הוא גוף מסוים, שלרוב עשוי ממתכת."],["volume","מהו נפח?",["כמות חומר","המקום שגוף תופס במרחב","כוח הכבידה","דרגת החום"],1,"נפח מודד את המקום שגוף תופס."],["volume","כמה מ״ל יש ב־2 ליטר?",["20","200","2,000","20,000"],2,"כל ליטר שווה 1,000 מ״ל."],["volume","כמה ליטרים הם 750 מ״ל?",["0.075","0.75","7.5","75"],1,"750 חלקי 1,000 הם 0.75 ליטר."],["volume","כמה סמ״ק הם 35 מ״ל?",["3.5","350","35","3,500"],2,"1 מ״ל = 1 סמ״ק."],["volume","במשורה היו 45 מ״ל מים. אחרי הכנסת אבן המפלס עלה ל־63 מ״ל. מה נפח האבן?",["18 סמ״ק","45 סמ״ק","63 סמ״ק","108 סמ״ק"],0,"63 פחות 45 = 18 סמ״ק."],["volume","לתיבה אורך 5 ס״מ, רוחב 3 ס״מ וגובה 2 ס״מ. מה הנפח?",["10 סמ״ק","15 סמ״ק","30 סמ״ק","60 סמ״ק"],2,"5 × 3 × 2 = 30 סמ״ק."],["volume","במה מודדים נפח נוזל?",["מאזניים","משורה","מד כוח","מדחום"],1,"משורה היא כלי למדידת נפח נוזלים."],["mass","מהי מסה?",["כוח הכבידה","נפח הגוף","מדד לכמות החומר בגוף","צורת הגוף"],2,"מסה היא מדד לכמות החומר בגוף."],["mass","באיזה מכשיר מודדים מסה?",["מאזניים","מד כוח","משורה","שעון"],0,"מאזניים מודדים מסה."],["mass","1.2 ק״ג שווים ל־",["12 גרם","120 גרם","1,200 גרם","12,000 גרם"],2,"1.2 × 1,000 = 1,200 גרם."],["mass","מסת כלי ריק 80 גרם, ועם חול 230 גרם. מה מסת החול?",["150 גרם","230 גרם","310 גרם","80 גרם"],0,"230 − 80 = 150 גרם."],["mass","כמה ק״ג הם 4,500 גרם?",["0.45","4.5","45","450"],1,"4,500 ÷ 1,000 = 4.5 ק״ג."],["mass","מה מסת שני גופים שמסותיהם 300 גרם ו־0.4 ק״ג?",["340 גרם","430 גרם","700 גרם","4,300 גרם"],2,"0.4 ק״ג = 400 גרם, יחד 700 גרם."],["weight","באיזו יחידה מודדים משקל בפיזיקה?",["גרם","קילוגרם","ליטר","ניוטון"],3,"משקל הוא כוח ולכן נמדד בניוטון."],["weight","מה קורה למסה של גוף במעבר מכדור הארץ לירח?",["קטנה","נשארת קבועה","מתאפסת","גדלה"],1,"המסה אינה תלויה בכוח הכבידה."],["weight","מה קורה למשקל על הירח?",["גדל","נשאר זהה","קטן","הופך לנפח"],2,"הכבידה על הירח חלשה יותר."],["weight","מסה 3 ק״ג, עוצמת כבידה 10 ניוטון לק״ג. מה המשקל?",["3 ניוטון","10 ניוטון","13 ניוטון","30 ניוטון"],3,"3 × 10 = 30 ניוטון."],["weight","משקל 60 ניוטון, עוצמת כבידה 10 ניוטון לק״ג. מה המסה?",["6 ק״ג","60 ק״ג","600 ק״ג","0.6 ק״ג"],0,"60 ÷ 10 = 6 ק״ג."],["weight","באיזה מכשיר מודדים משקל ככוח?",["משורה","מד כוח","סרגל","מדחום"],1,"מד כוח (דינמומטר) מודד כוח."],["weight","איזה משפט נכון?",["מסה נמדדת בניוטון","משקל נמדד בגרם","מסה ומשקל זהים","מסה בק״ג ומשקל בניוטון"],3,"אלה גדלים שונים עם יחידות שונות."],["weight","על כדור הארץ עוצמת הכבידה 9.8 ניוטון לק״ג. מה משקלו של גוף שמסתו 2 ק״ג?",["9.8 ניוטון","19.6 ניוטון","11.8 ניוטון","4.9 ניוטון"],1,"נוסחה: משקל = מסה × עוצמת הכבידה. מציבים: 2 ק״ג × 9.8 ניוטון לק״ג = 19.6 ניוטון."],["weight","על כדור הארץ g=9.8 ניוטון לק״ג. מה משקלו של גוף שמסתו 5 ק״ג?",["49 ניוטון","14.8 ניוטון","1.96 ניוטון","98 ניוטון"],0,"משקל = מסה × עוצמת הכבידה = 5 × 9.8 = 49 ניוטון."],["weight","עוצמת הכבידה 9.8 ניוטון לק״ג. מה משקלו של גוף שמסתו 0.5 ק״ג?",["19.6 ניוטון","10.3 ניוטון","4.9 ניוטון","0.49 ניוטון"],2,"משקל = מסה × עוצמת הכבידה = 0.5 × 9.8 = 4.9 ניוטון."],["weight","גוף שוקל 98 ניוטון על כדור הארץ (g=9.8 ניוטון לק״ג). מה המסה שלו?",["960.4 ק״ג","10 ק״ג","9.8 ק״ג","100 ק״ג"],1,"משקל = מסה × עוצמת הכבידה. כדי למצוא מסה: מסה = משקל ÷ עוצמת הכבידה = 98 ÷ 9.8 = 10 ק״ג."],["weight","על הירח עוצמת הכבידה בקירוב 1.6 ניוטון לק״ג. מה משקלו של גוף שמסתו 3 ק״ג?",["1.875 ניוטון","4.6 ניוטון","30 ניוטון","4.8 ניוטון"],3,"משקל = מסה × עוצמת הכבידה = 3 × 1.6 = 4.8 ניוטון. המסה נשארת 3 ק״ג."],["weight","גוף שמסתו 4 ק״ג: כמה הוא שוקל על כדור הארץ, אם g=9.8 ניוטון לק״ג?",["39.2 ניוטון","2.45 ניוטון","13.8 ניוטון","98 ניוטון"],0,"משקל = 4 × 9.8 = 39.2 ניוטון."],["weight","גוף שמסתו 250 גרם נמצא במקום שבו g=9.8 ניוטון לק״ג. מה משקלו?",["2,450 ניוטון","24.5 ניוטון","2.45 ניוטון","0.025 ניוטון"],2,"קודם ממירים: 250 גרם = 0.25 ק״ג. לאחר מכן משקל = מסה × עוצמת הכבידה = 0.25 × 9.8 = 2.45 ניוטון."],["weight","משקל גוף הוא 29.4 ניוטון בכבידה של 9.8 ניוטון לק״ג. מה מסתו?",["288.12 ק״ג","3 ק״ג","19.6 ק״ג","0.3 ק״ג"],1,"מסה = משקל ÷ עוצמת הכבידה = 29.4 ÷ 9.8 = 3 ק״ג."]];
const $=id=>document.getElementById(id),key=new URLSearchParams(location.search).get('topic'),chosen=topics[key]?key:'all',qs=bank.filter(q=>chosen==='all'||q[0]===chosen);
$('title').textContent='🔬 '+topics[chosen];
for(let i=qs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
let pos=0,score=0,done=false;
function show(){done=false;let q=qs[pos];$('category').textContent=topics[q[0]];$('counter').textContent='שאלה '+(pos+1)+' מתוך '+qs.length+' • '+score+' תשובות נכונות';$('bar').style.width=pos/qs.length*100+'%';$('question').textContent=q[1];$('feedback').textContent='';$('fox').className='fox';$('next').hidden=true;$('answers').innerHTML='';let opts=q[2].map((v,i)=>({v,ok:i===q[3]}));for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}opts.forEach((o,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=o.v;b.onclick=()=>{if(done)return;done=true;if(o.ok)score++;[...$('answers').children].forEach((z,j)=>{z.disabled=true;if(opts[j].ok)z.classList.add('good');else if(j===i)z.classList.add('bad')});$('feedback').textContent=(o.ok?'כל הכבוד! ':'לא נורא. התשובה הנכונה: '+q[2][q[3]]+'. ')+q[4];$('fox').src=o.ok?'assets/fox-happy-v3.webp':'assets/fox-sad.svg';$('fox').className='fox show';$('next').hidden=false;$('next').textContent=pos===qs.length-1?'הצג את הציון':'לשאלה הבאה ←'};$('answers').appendChild(b)})}
$('next').onclick=()=>{pos++;if(pos<qs.length)show();else{$('game').hidden=true;$('bar').style.width='100%';$('result').hidden=false;$('result').innerHTML='<h2>🏆 סיימת!</h2><h1>'+Math.round(score/qs.length*100)+'/100</h1><p>'+score+' תשובות נכונות מתוך '+qs.length+'</p><button class="btn" onclick="location.reload()">תרגול חוזר</button> <a class="btn" href="science.html">חזרה לנושאים</a>'}};show();</script><script src="exam-timer.js"></script></body></html>
