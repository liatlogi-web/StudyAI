<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תרגול מדעים לפי רמות | StudyAI</title><style>*{box-sizing:border-box}body{direction:rtl;font:17px system-ui,Arial;margin:0}header{background:#162e67;color:white;padding:18px 5%;display:flex;justify-content:space-between}header a{color:white}main{max-width:960px;margin:28px auto;padding:0 15px}.panel{background:white;border-radius:22px;padding:25px;margin:15px 0}.muted{color:#66758b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{display:block;background:#fff;border:1px solid #dbe5f5;border-radius:20px;padding:23px 12px;text-align:center;text-decoration:none;color:#183150;font-weight:850}.tile span{display:block;font-size:36px}.tile small{display:block;color:#66758b;margin-top:5px}.btn{display:inline-block;background:#1687ff;color:white;border:0;border-radius:15px;padding:12px 19px;font:inherit;cursor:pointer;text-decoration:none}.answer{display:block;width:100%;border:2px solid #dce5f5;border-radius:15px;background:#f8faff;text-align:right;font:inherit;padding:15px;margin:10px 0;cursor:pointer}#feedback{white-space:pre-line;line-height:1.7;background:#eef7ff;padding:12px;border-radius:12px}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.progress{background:#e4eaf6;height:10px;border-radius:20px;overflow:hidden}.progress div{background:#1687ff;height:100%}.fox{display:none;width:145px;margin:10px auto}.fox.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:18px}}</style><style>.levelbox{background:#f1f8ff;border:1px solid #cce5ff;border-radius:17px;padding:15px;margin:14px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.levelbox label{font-weight:850}.levelbox select{padding:11px 15px;border-radius:12px;border:1px solid #92b6e5;font:inherit;background:white;color:#123}.levelhelp{font-size:13px;color:#49647c}.answer:disabled{cursor:default}#feedback{white-space:pre-line;line-height:1.8;background:#edf8ff;padding:16px;border-radius:15px;margin:16px 0}.fox{max-width:150px}</style></head><body><header><strong>🎓 StudyAI</strong><a href="science.html">חזרה למדעים</a></header><main><section class="panel"><h1 id="title">תרגול מדעים</h1><div class="levelbox"><label for="level">בחר רמה:</label><select id="level"><option value="1">🟢 קל (מומלץ להתחלה)</option><option value="2">🟡 בינוני</option><option value="3">🔴 מאתגר</option></select><span class="levelhelp">אפשר לשנות רמה בכל רגע • שינוי הרמה מתחיל סבב חדש</span></div><p class="muted">שאלה אחת בכל פעם • הסבר בשלבים אחרי התשובה • ציון בסוף</p><div class="progress"><div id="bar"></div></div><p id="counter" class="muted"></p><div id="game"><p id="category" style="color:#1687ff;font-weight:850"></p><h2 id="question"></h2><div id="answers"></div><div id="feedback" hidden aria-live="polite"></div><img id="fox" class="fox" alt="שועל StudyAI"><button id="next" class="btn" type="button" hidden>לשאלה הבאה ←</button></div><div id="result" hidden></div></section></main><script>
const topics={body:"גוף וחומר",volume:"נפח ויחידות מידה",mass:"מסה",weight:"מסה ומשקל",all:"כל הנושאים ביחד"},bank=[["body",1,"מהו גוף?",["עצם מסוים שיש לו מסה ונפח","סוג של כוח","יחידת מידה","הטמפרטורה"],0,"גוף הוא עצם מסוים, כמו שולחן, כוס או עיפרון."],["body",1,"כוס עשויה זכוכית. מהו החומר?",["הכוס","הזכוכית","הצורה של הכוס","המשקל"],1,"הכוס היא הגוף. זכוכית היא החומר שממנו הכוס עשויה."],["body",1,"איזה מהבאים הוא גוף?",["עץ כחומר","פלסטיק","בקבוק","ברזל"],2,"בקבוק הוא גוף מסוים, והוא יכול להיות עשוי מחומר כמו פלסטיק."],["body",2,"איזה משפט נכון?",["כל גוף עשוי רק מחומר אחד","אותו חומר יכול לשמש לגופים שונים","לחומר אין תכונות","לכל הגופים אותה מסה"],1,"למשל אפשר להכין גם כוס וגם חלון מזכוכית."],["body",2,"מה הזוג הנכון של גוף וחומר?",["סיר ואלומיניום","זכוכית וחלון","פלסטיק ובקבוק","עץ ושולחן"],0,"הסיר הוא הגוף, והאלומיניום הוא החומר."],["body",3,"כדור מורכב מפלסטיק ומגומי. איזה משפט נכון?",["כדור אינו גוף כי יש בו שני חומרים","הכדור הוא גוף שעשוי מכמה חומרים","פלסטיק וגומי הם שני גופים","הכדור הוא יחידת נפח"],1,"גוף אחד יכול להיות עשוי מכמה חומרים שונים."],["volume",1,"מה מודדים בנפח?",["כמה חומר יש בגוף","את המקום שגוף תופס במרחב","כוח כבידה","משקל"],1,"נפח הוא המקום שגוף תופס במרחב."],["volume",1,"באיזה כלי מודדים נפח של מים?",["משורה","מאזניים","מד כוח","מדחום"],0,"משורה מודדת נפח של נוזלים."],["volume",1,"כמה מיליליטרים יש בליטר?",["10","100","1,000","10,000"],2,"1 ליטר = 1,000 מיליליטר."],["volume",2,"כמה מיליליטרים יש ב־2.5 ליטר?",["250","2,500","25","25,000"],1,"שלב 1: 1 ליטר = 1,000 מ״ל.\nשלב 2: 2.5 × 1,000 = 2,500 מ״ל."],["volume",2,"במשורה היו 40 מ״ל מים. אחרי הכנסת אבן המפלס עלה ל־65 מ״ל. מה נפח האבן?",["105 סמ״ק","65 סמ״ק","40 סמ״ק","25 סמ״ק"],3,"שלב 1: נפח האבן = נפח סופי פחות נפח התחלתי.\nשלב 2: 65 − 40 = 25 מ״ל.\nשלב 3: 25 מ״ל = 25 סמ״ק."],["volume",2,"כמה סמ״ק הם 25 מ״ל?",["25","250","2.5","2,500"],0,"1 מ״ל שווה בדיוק ל־1 סמ״ק. לכן 25 מ״ל = 25 סמ״ק."],["volume",3,"מה נפח תיבה שאורכה 4 ס״מ, רוחבה 3 ס״מ וגובהה 5 ס״מ?",["12 סמ״ק","20 סמ״ק","60 סמ״ק","35 סמ״ק"],2,"שלב 1: נפח תיבה = אורך × רוחב × גובה.\nשלב 2: 4 × 3 × 5 = 60 סמ״ק."],["mass",1,"מהי מסה?",["מדד לכמות החומר בגוף","המקום שהגוף תופס","עוצמת הכבידה","המהירות"],0,"מסה היא מדד לכמות החומר בגוף."],["mass",1,"באיזה כלי מודדים מסה?",["משורה","מדחום","מאזניים","מד כוח"],2,"מסה מודדים במאזניים."],["mass",1,"כמה גרמים יש בקילוגרם אחד?",["100","1,000","10","10,000"],1,"1 ק״ג = 1,000 גרם."],["mass",2,"כמה גרמים הם 1.5 ק״ג?",["150","15","1,500","15,000"],2,"שלב 1: 1 ק״ג = 1,000 גרם.\nשלב 2: 1.5 × 1,000 = 1,500 גרם."],["mass",2,"כוס ריקה מסתה 100 גרם. כוס עם מים מסתה 350 גרם. מה מסת המים?",["250 גרם","450 גרם","350 גרם","100 גרם"],0,"שלב 1: מסת המים = מסת כוס מלאה פחות מסת כוס ריקה.\nשלב 2: 350 − 100 = 250 גרם."],["mass",3,"מחברים גוף שמסתו 250 גרם לגוף שמסתו 0.8 ק״ג. מה המסה הכוללת?",["1,050 גרם","800 גרם","1,300 גרם","1.05 גרם"],0,"שלב 1: ממירים 0.8 ק״ג ל־800 גרם.\nשלב 2: 800 + 250 = 1,050 גרם."],["weight",1,"באיזו יחידה מודדים משקל בפיזיקה?",["קילוגרם","ניוטון","ליטר","גרם"],1,"משקל הוא כוח, ולכן יחידת המידה שלו היא ניוטון."],["weight",1,"מה קורה למסתו של גוף אם מעבירים אותו מכדור הארץ לירח?",["נשארת אותו דבר","קטנה פי 6","גדלה","מתאפסת"],0,"מסה לא תלויה בעוצמת הכבידה."],["weight",1,"מה הנוסחה לחישוב משקל?",["משקל = מסה + כבידה","משקל = מסה ÷ כבידה","משקל = מסה × עוצמת הכבידה","משקל = נפח × מסה"],2,"שלב 1: מזהים מסה בק״ג.\nשלב 2: מזהים עוצמת כבידה בניוטון לק״ג.\nשלב 3: מכפילים ביניהם ומקבלים משקל בניוטון."],["weight",1,"בכדור הארץ עוצמת הכבידה 9.8 ניוטון לק״ג. מה משקלו של גוף שמסתו 2 ק״ג?",["19.6 ניוטון","11.8 ניוטון","4.9 ניוטון","9.8 ניוטון"],0,"שלב 1: משקל = מסה × עוצמת הכבידה.\nשלב 2: מציבים: 2 × 9.8.\nשלב 3: 2 × 9.8 = 19.6 ניוטון."],["weight",1,"גוף שמסתו 3 ק״ג נמצא בכבידה של 10 ניוטון לק״ג. מה משקלו?",["13 ניוטון","30 ניוטון","3 ניוטון","10 ניוטון"],1,"שלב 1: משקל = מסה × עוצמת הכבידה.\nשלב 2: מציבים: 3 × 10.\nשלב 3: המשקל הוא 30 ניוטון."],["weight",1,"בכדור הארץ עוצמת הכבידה 9.8 ניוטון לק״ג. מה משקלו של גוף שמסתו 5 ק״ג?",["14.8 ניוטון","9.8 ניוטון","49 ניוטון","98 ניוטון"],2,"שלב 1: משקל = מסה × עוצמת הכבידה.\nשלב 2: 5 × 9.8 = 49 ניוטון."],["weight",2,"בכדור הארץ g=9.8 ניוטון לק״ג. מה משקלו של גוף שמסתו 0.5 ק״ג?",["19.6 ניוטון","4.9 ניוטון","9.8 ניוטון","0.49 ניוטון"],1,"שלב 1: משקל = מסה × עוצמת הכבידה.\nשלב 2: 0.5 × 9.8 = 4.9 ניוטון."],["weight",2,"על הירח עוצמת הכבידה היא 1.6 ניוטון לק״ג. מה משקלו של גוף שמסתו 3 ק״ג?",["4.8 ניוטון","1.6 ניוטון","9.6 ניוטון","30 ניוטון"],0,"שלב 1: משקל = מסה × עוצמת הכבידה.\nשלב 2: 3 × 1.6 = 4.8 ניוטון."],["weight",2,"לגוף מסה של 2 ק״ג. כמה הוא שוקל על הירח אם g=1.6 ניוטון לק״ג?",["19.6 ניוטון","3.2 ניוטון","0.8 ניוטון","9.8 ניוטון"],1,"שלב 1: המסה נשארת 2 ק״ג.\nשלב 2: משקל = מסה × כבידה.\nשלב 3: 2 × 1.6 = 3.2 ניוטון."],["weight",3,"גוף שוקל 98 ניוטון על כדור הארץ, שם g=9.8 ניוטון לק״ג. מה מסתו?",["10 ק״ג","9.8 ק״ג","96.04 ק״ג","980 ק״ג"],0,"שלב 1: משקל = מסה × עוצמת הכבידה.\nשלב 2: כדי למצוא מסה, מחלקים את המשקל בכבידה.\nשלב 3: 98 ÷ 9.8 = 10 ק״ג."],["weight",3,"משקלו של גוף הוא 24 ניוטון ומסתו 6 ק״ג. מה עוצמת הכבידה?",["18 ניוטון לק״ג","4 ניוטון לק״ג","144 ניוטון לק״ג","0.25 ניוטון לק״ג"],1,"שלב 1: משקל = מסה × כבידה.\nשלב 2: עוצמת הכבידה = משקל ÷ מסה.\nשלב 3: 24 ÷ 6 = 4 ניוטון לק״ג."],["weight",3,"גוף שמסתו 250 גרם נמצא בכבידה של 9.8 ניוטון לק״ג. מה משקלו?",["24.5 ניוטון","2,450 ניוטון","2.45 ניוטון","0.245 ניוטון"],2,"שלב 1: ממירים מסה לק״ג: 250 גרם = 0.25 ק״ג.\nשלב 2: משקל = מסה × כבידה.\nשלב 3: 0.25 × 9.8 = 2.45 ניוטון."]];
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),topic=topics[params.get("topic")]?params.get("topic"):"all";
let level=Number(params.get("level"))||1;if(level<1||level>3)level=1;
let qs=[],pos=0,score=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function restart(){
  level=Number($("level").value);params.set("level",String(level));history.replaceState(null,"",location.pathname+"?"+params.toString());
  qs=shuffle(bank.filter(q=>(topic==="all"||q[0]===topic)&&q[1]===level));pos=0;score=0;
  $("game").hidden=false;$("result").hidden=true;
  $("title").textContent="🔬 "+topics[topic];render()
}
function render(){
  locked=false;const q=qs[pos];$("counter").textContent="שאלה "+(pos+1)+" מתוך "+qs.length+" | נכונות: "+score;
  $("bar").style.width=(pos/qs.length*100)+"%";$("category").textContent=topics[q[0]];
  $("question").textContent=q[2];$("feedback").hidden=true;$("feedback").textContent="";
  $("fox").classList.remove("show");$("next").hidden=true;$("answers").innerHTML="";
  const opts=shuffle(q[3].map((answer,i)=>({answer,ok:i===q[4]})));
  opts.forEach((o,i)=>{const b=document.createElement("button");b.className="answer";b.type="button";b.textContent=o.answer;b.onclick=()=>{
    if(locked)return;locked=true;if(o.ok)score++;
    [...$("answers").children].forEach((el,j)=>{el.disabled=true;if(opts[j].ok)el.classList.add("good");else if(j===i)el.classList.add("bad")});
    $("feedback").hidden=false;$("feedback").textContent=(o.ok?"✅ כל הכבוד!":"לא נורא! התשובה הנכונה: "+q[3][q[4]])+"\n\nאיך פותרים?\n"+q[5];
    $("fox").src=o.ok?"assets/fox-happy-v3.webp":"assets/fox-sad.svg";$("fox").classList.add("show");
    $("next").textContent=pos===qs.length-1?"הצג ציון":"לשאלה הבאה ←";$("next").hidden=false;
  };$("answers").appendChild(b)})
}
$("next").onclick=()=>{pos++;if(pos<qs.length)render();else{
  $("game").hidden=true;$("result").hidden=false;$("bar").style.width="100%";
  $("result").innerHTML="<h2>🏆 סיימת!</h2><h1>"+Math.round(score/qs.length*100)+"/100</h1><p>ענית נכון על "+score+" מתוך "+qs.length+" שאלות.</p><button id='again' class='btn' type='button'>לתרגל שוב</button> <a class='btn' href='science.html'>חזרה למדעים</a>";
  $("again").onclick=restart;
}};
$("level").value=String(level);$("level").onchange=restart;restart();</script><script src="exam-timer.js"></script></body></html>
