const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),topic=topics[params.get("topic")]?params.get("topic"):"all";
let level=Number(params.get("level"))||1;if(level<1||level>3)level=1;
let qs=[],pos=0,score=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function restart(){
  level=Number($("level").value);params.set("level",String(level));history.replaceState(null,"",location.pathname+"?"+params.toString());
  const pool=bank.filter(q=>(topic==="all"||q[0]===topic)&&q[1]===level);
  if(topic==="all"){
    const groups=["body","volume","mass","weight"].map(t=>shuffle(pool.filter(q=>q[0]===t)));
    qs=shuffle([...groups[0].slice(0,4),...groups[1].slice(0,4),...groups[2].slice(0,4),...groups[3].slice(0,3)]);
  } else {qs=shuffle(pool).slice(0,15);}
  pos=0;score=0;
  $("game").hidden=false;$("result").hidden=true;
  $("title").textContent="🔬 "+topics[topic];render()
}
function render(){
  locked=false;const q=qs[pos];$("counter").textContent="שאלה "+(pos+1)+" מתוך "+qs.length+" | נכונות: "+score;
  $("bar").style.width=(pos/qs.length*100)+"%";$("category").textContent=topics[q[0]];
  $("question").textContent=q[2];$("feedback").hidden=true;$("feedback").textContent="";
  $("fox").classList.remove("show");$("next").hidden=true;$("answers").innerHTML="";
  const opts=shuffle(q[3].map((answer,i)=>({answer,ok:i===q[4]})));
  opts.forEach((o,i)=>{const b=document.createElement("button");b.className="answer";b.type="button";b.textContent=o.answer;b.onclick=()=>{
    if(locked)return;locked=true;if(o.ok)score++;
    [...$("answers").children].forEach((el,j)=>{el.disabled=true;if(opts[j].ok)el.classList.add("good");else if(j===i)el.classList.add("bad")});
    $("feedback").hidden=false;$("feedback").textContent=(o.ok?"✅ כל הכבוד!":"לא נורא! התשובה הנכונה: "+q[3][q[4]])+"\n\nאיך פותרים?\n"+q[5];
    $("fox").src=o.ok?"assets/fox-happy-v3.webp":"assets/fox-sad.svg";$("fox").classList.add("show");
    $("next").textContent=pos===qs.length-1?"הצג ציון":"לשאלה הבאה ←";$("next").hidden=false;
  };$("answers").appendChild(b)})
}
$("next").onclick=()=>{pos++;if(pos<qs.length)render();else{
  $("game").hidden=true;$("result").hidden=false;$("bar").style.width="100%";
  $("result").innerHTML="<h2>🏆 סיימת!</h2><h1>"+Math.round(score/qs.length*100)+"/100</h1><p>ענית נכון על "+score+" מתוך "+qs.length+" שאלות.</p><button id='again' class='btn' type='button'>לתרגל שוב</button> <a class='btn' href='science.html'>חזרה למדעים</a>";
  $("again").onclick=restart;
}};
