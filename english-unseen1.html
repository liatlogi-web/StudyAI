dding:8px 9px}.passage{font-size:17px}.panel{padding:18px}.passage-title{display:block}}</style></head><body><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a><header><strong>📖 Unseen — תרגול מלא למבחן</strong></header><main><section class="panel"><div class="passage-title"><strong id="passageName"></strong><span class="muted">קרא את הקטע ואז ענה על השאלות</span></div><div id="passage" class="passage"></div><details id="wordHelp" style="margin-top:13px;border-radius:12px;background:#edf6ff;padding:12px;font-size:16px"><summary style="font-weight:900;cursor:pointer">📖 מילים שיעזרו לי להבין את הטקסט (בעברית)</summary><div id="wordList" style="margin-top:10px;line-height:2"></div></details></section><section class="panel"><p id="counter" class="muted"></p><div class="progress"><div id="bar"></div></div><div id="question" class="question"></div><div id="questionHebrew" style="direction:rtl;color:#52718c;font-weight:800;margin:-8px 0 15px"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">שאלה הבאה ←</button></section></main><script>const sets=[{"title":"Unseen 1 — Maya and Max","text":"Maya has a dog. His name is Max. Max is brown. Maya and Max go to the park. They play with a red ball. Maya gives Max water. They go home at five.","he":"מאיה ומקס","glossary":{"dog":"כלב","brown":"חום","park":"פארק","ball":"כדור","water":"מים"},"qs":[["What animal does Maya have?",["a dog","a cat","a bird","a fish"],0,"איזו חיה יש למאיה?"],["What is his name?",["Tom","Max","Dan","Ben"],1,"איך קוראים לו?"],["What color is Max?",["black","white","brown","blue"],2,"מה הצבע של מקס?"],["Where do they go?",["the school","the shop","the sea","the park"],3,"לאן הם הולכים?"],["What color is the ball?",["red","blue","green","yellow"],0,"מה צבע הכדור?"],["When do they go home?",["at two","at five","at eight","at ten"],1,"מתי הם חוזרים הביתה?"]]},{"title":"Unseen 2 — Ben at School","text":"Ben is twelve. He goes to school by bus. His school is big. Ben likes English. At ten, he eats an apple. His friend is Tom. They play football after school.","he":"בן בבית הספר","glossary":{"by bus":"באוטובוס","big":"גדול","apple":"תפוח","friend":"חבר","after":"אחרי"},"qs":[["How old is Ben?",["twelve","ten","eleven","thirteen"],0,"בן כמה בן?"],["How does Ben go to school?",["by car","by bus","by bike","on foot"],1,"איך בן מגיע לבית הספר?"],["Is his school big or small?",["small","new","big","old"],2,"בית הספר גדול או קטן?"],["What lesson does Ben like?",["math","music","art","English"],3,"איזה מקצוע בן אוהב?"],["What does Ben eat?",["an apple","a banana","a cake","a sandwich"],0,"מה בן אוכל?"],["Who is Ben's friend?",["Max","Tom","Ron","Dan"],1,"מי החבר של בן?"]]},{"title":"Unseen 3 — Ella's Birthday","text":"Today is Ella's birthday. Ella is thirteen. She has a party at home. Her cake is pink. Five friends come to the party. They eat pizza. Ella gets a new book.","he":"יום ההולדת של אלה","glossary":{"birthday":"יום הולדת","party":"מסיבה","cake":"עוגה","friends":"חברים","book":"ספר"},"qs":[["How old is Ella?",["thirteen","ten","eleven","twelve"],0,"בת כמה אלה?"],["Where is the party?",["at school","at home","at the park","at the beach"],1,"איפה המסיבה?"],["What color is the cake?",["blue","green","pink","red"],2,"מה צבע העוגה?"],["How many friends come?",["two","three","six","five"],3,"כמה חברים באים?"],["What do they eat?",["pizza","rice","salad","bread"],0,"מה הם אוכלים?"],["What does Ella get?",["a ball","a book","a bike","a bag"],1,"מה אלה מקבלת?"]]},{"title":"Unseen 4 — Adam at the Beach","text":"Adam goes to the beach on Saturday. He goes with his sister. The sea is blue. Adam has a yellow ball. They eat sandwiches at one. Adam drinks water. They go home by car.","he":"אדם בחוף הים","glossary":{"beach":"חוף ים","sister":"אחות","sea":"ים","yellow":"צהוב","by car":"במכונית"},"qs":[["When does Adam go to the beach?",["Saturday","Sunday","Monday","Friday"],0,"מתי אדם הולך לים?"],["Who goes with Adam?",["his brother","his sister","his teacher","his friend"],1,"מי הולך עם אדם?"],["What color is the sea?",["green","black","blue","red"],2,"מה צבע הים?"],["What color is the ball?",["blue","pink","white","yellow"],3,"מה צבע הכדור?"],["When do they eat?",["at one","at two","at four","at five"],0,"מתי הם אוכלים?"],["How do they go home?",["by bus","by car","by train","by bike"],1,"איך הם חוזרים הביתה?"]]},{"title":"Unseen 5 — The School Garden","text":"Our school has a garden. It is small. We grow red tomatoes. Dana brings water every day. We work in the garden on Monday. Our teacher is happy. We put tomatoes in a green box.","he":"הגינה של בית הספר","glossary":{"garden":"גינה","grow":"מגדלים","tomatoes":"עגבניות","brings":"מביאה","box":"קופסה"},"qs":[["What does the school have?",["a garden","a pool","a shop","a zoo"],0,"מה יש בבית הספר?"],["Is the garden big or small?",["big","small","new","old"],1,"הגינה גדולה או קטנה?"],["What do the students grow?",["apples","bananas","tomatoes","carrots"],2,"מה התלמידים מגדלים?"],["Who brings water?",["Ella","Tom","Max","Dana"],3,"מי מביא מים?"],["When do they work?",["Monday","Tuesday","Friday","Sunday"],0,"מתי הם עובדים בגינה?"],["What color is the box?",["red","green","blue","pink"],1,"מה צבע הקופסה?"]]},{"title":"Unseen 6 — Leo and Ron","text":"Leo is new at school. He is in class seven. Ron sits next to Leo. Ron has a blue bag. At lunch, they eat pizza. They play basketball in the park. Leo is happy.","he":"ליאו ורון","glossary":{"new":"חדש","next to":"ליד","bag":"תיק","lunch":"ארוחת צהריים","happy":"שמח"},"qs":[["Who is new at school?",["Leo","Ron","Tom","Ben"],0,"מי חדש בבית הספר?"],["What class is Leo in?",["six","seven","eight","five"],1,"באיזו כיתה ליאו?"],["Who sits next to Leo?",["Dan","Max","Ron","Ella"],2,"מי יושב ליד ליאו?"],["What color is Ron's bag?",["pink","red","green","blue"],3,"מה צבע התיק של רון?"],["What do they eat?",["pizza","rice","fish","soup"],0,"מה הם אוכלים?"],["Where do they play basketball?",["the school","the park","the beach","the house"],1,"איפה הם משחקים כדורסל?"]]},{"title":"Unseen 7 — Sara's Trip","text":"Sara goes on a trip with her dad. They go on Friday. They travel by car. They see a big river. Sara takes photos. They eat pasta at a cafe. They go home at six.","he":"הטיול של שרה","glossary":{"trip":"טיול","travel":"נוסעים","river":"נהר","photos":"תמונות","cafe":"בית קפה"},"qs":[["Who goes with Sara?",["her dad","her mom","her sister","her friend"],0,"מי בא עם שרה?"],["When is the trip?",["Monday","Friday","Saturday","Tuesday"],1,"מתי הטיול?"],["How do they travel?",["by bus","by train","by car","by bike"],2,"איך הם נוסעים?"],["What do they see?",["a mountain","a dog","a shop","a river"],3,"מה הם רואים?"],["What do they eat?",["pasta","pizza","rice","bread"],0,"מה הם אוכלים?"],["When do they go home?",["at two","at six","at eight","at ten"],1,"מתי הם חוזרים?"]]},{"title":"Unseen 8 — Dan's Book","text":"Dan likes books. His favorite book is about a dog. The dog is black. The dog lives with a boy named Ben. They play in a park. The book has twenty pages. Dan reads it at night.","he":"הספר של דן","glossary":{"favorite":"אהוב","black":"שחור","lives":"גר","pages":"עמודים","night":"לילה"},"qs":[["What does Dan like?",["books","cars","sports","music"],0,"מה דן אוהב?"],["What animal is in the book?",["a cat","a dog","a bird","a fish"],1,"איזו חיה בספר?"],["What color is the dog?",["white","brown","black","red"],2,"מה צבע הכלב?"],["What is the boy's name?",["Tom","Leo","Max","Ben"],3,"איך קוראים לילד בספר?"],["Where do they play?",["a park","a school","a shop","a beach"],0,"איפה הם משחקים?"],["When does Dan read?",["in the morning","at night","at noon","at school"],1,"מתי דן קורא?"]]},{"title":"Unseen 9 — Football with Friends","text":"Tom likes football. He plays with Ben on Sunday. They play at the park. Tom has a green shirt. Ben has a red shirt. They play for one hour. After the game, they drink water.","he":"כדורגל עם חברים","glossary":{"football":"כדורגל","shirt":"חולצה","green":"ירוק","hour":"שעה","game":"משחק"},"qs":[["What sport does Tom like?",["football","tennis","basketball","swimming"],0,"איזה ספורט טום אוהב?"],["Who plays with Tom?",["Dan","Ben","Max","Leo"],1,"מי משחק עם טום?"],["When do they play?",["Monday","Friday","Sunday","Tuesday"],2,"מתי הם משחקים?"],["Where do they play?",["the beach","the school","the house","the park"],3,"איפה הם משחקים?"],["What color is Tom's shirt?",["green","red","yellow","white"],0,"מה צבע החולצה של טום?"],["What do they drink?",["milk","water","juice","tea"],1,"מה הם שותים?"]]},{"title":"Unseen 10 — Mia at the Shop","text":"Mia goes to a shop with her mother. It is Saturday. They buy red apples and yellow bananas. Mia sees a small white dog. Her mother buys bread. They go home at three. Mia puts the food on the table.","he":"מיה בחנות","glossary":{"shop":"חנות","buy":"קונים","apples":"תפוחים","white":"לבן","table":"שולחן"},"qs":[["Who goes with Mia?",["her mother","her father","her sister","her friend"],0,"מי הולך עם מיה?"],["When do they go?",["Sunday","Saturday","Monday","Friday"],1,"מתי הם הולכים?"],["What fruit is red?",["bananas","lemons","apples","oranges"],2,"איזה פרי אדום?"],["What color is the dog?",["black","brown","blue","white"],3,"מה צבע הכלב?"],["What does her mother buy?",["bread","rice","milk","cake"],0,"מה אמא קונה?"],["When do they go home?",["at five","at three","at seven","at ten"],1,"מתי הם חוזרים הביתה?"]]},{"title":"Unseen 11 — Lily at Home","text":"It is a rainy day. Lily is at home. She draws a big yellow sun. After lunch, she calls Emma. Emma is her friend. Lily makes cookies with her dad. The cookies are good. At five, Lily watches TV.","he":"לילי בבית","glossary":{"rainy":"גשום","draws":"מציירת","calls":"מתקשרת","cookies":"עוגיות","watches":"צופה"},"qs":[["What is the weather like?",["rainy","sunny","hot","snowy"],0,"מה מזג האוויר?"],["Where is Lily?",["at school","at home","in the park","at the beach"],1,"איפה לילי?"],["What does Lily draw?",["a cat","a dog","a sun","a house"],2,"מה לילי מציירת?"],["Who does Lily call?",["Noa","Maya","Sara","Emma"],3,"למי לילי מתקשרת?"],["Who makes cookies with Lily?",["her dad","her mom","her brother","her friend"],0,"מי מכין עוגיות עם לילי?"],["What does Lily do at five?",["reads a book","watches TV","plays football","goes to school"],1,"מה לילי עושה בחמש?"]]},{"title":"Unseen 12 — Noa at the Library","text":"Noa goes to the library on Thursday. She loves animals. She wants a book about cats. The book is blue. Noa reads for one hour. Then she goes home. She shows the book to her brother.","he":"נועה בספרייה","glossary":{"library":"ספרייה","animals":"חיות","wants":"רוצה","reads":"קוראת","shows":"מראה"},"qs":[["Where does Noa go?",["the library","the school","the beach","the shop"],0,"לאן נועה הולכת?"],["When does she go?",["Monday","Thursday","Saturday","Sunday"],1,"מתי היא הולכת?"],["What does Noa love?",["cars","music","animals","sports"],2,"מה נועה אוהבת?"],["What animal is the book about?",["dogs","fish","birds","cats"],3,"על איזו חיה הספר?"],["What color is the book?",["blue","red","green","yellow"],0,"מה צבע הספר?"],["Who sees the book at home?",["her mom","her brother","her teacher","her friend"],1,"מי רואה את הספר בבית?"]]},{"title":"Unseen 13 — Eitan's Bike","text":"Eitan rides a bike. His sister Yael rides with him. It is Sunday. Eitan's bike is black. Yael's bike is pink. They ride to the park. They drink water. They go home at six.","he":"האופניים של איתן","glossary":{"bike":"אופניים","rides":"רוכב","sister":"אחות","pink":"ורוד","home":"בית"},"qs":[["What does Eitan ride?",["a bike","a horse","a bus","a train"],0,"על מה איתן רוכב?"],["Who rides with Eitan?",["Noa","Yael","Maya","Ella"],1,"מי רוכבת עם איתן?"],["What day is it?",["Friday","Tuesday","Sunday","Thursday"],2,"איזה יום היום?"],["What color is Eitan's bike?",["pink","white","green","black"],3,"מה צבע האופניים של איתן?"],["Where do they go?",["the park","the school","the beach","the library"],0,"לאן הם הולכים?"],["When do they go home?",["at four","at six","at two","at eight"],1,"מתי הם חוזרים?"]]}];
sets.forEach(s=>s.qs=s.qs.slice(0,6));
const $=id=>document.getElementById(id);
const deckKey="studyai_unseen_deck_v3_"+(localStorage.getItem("studyai_active_v1")||"guest");
let score=0,position=0,locked=false,pickedSet=-1;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseSet(){
 let state;try{state=JSON.parse(localStorage.getItem(deckKey)||"null")}catch(e){}
 const n=sets.length;
 if(!state||!Array.isArray(state.deck)||state.deck.length!==n||new Set(state.deck).size!==n||state.deck.some(x=>!Number.isInteger(x)||x<0||x>=n))state={deck:shuffle([...sets.keys()]),used:0,last:-1};
 if(state.used>=n){state.deck=shuffle([...sets.keys()]);if(n>1&&state.deck[0]===state.last)[state.deck[0],state.deck[1]]=[state.deck[1],state.deck[0]];state.used=0}
 const idx=state.deck[state.used++];state.last=idx;
 try{localStorage.setItem(deckKey,JSON.stringify(state))}catch(e){}
 return idx
}
function show(){
 locked=false;
 const set=sets[pickedSet],q=set.qs[position];
 $("passageName").textContent=set.title;
 $("passage").textContent=set.text;
 $("wordList").textContent=Object.entries(set.glossary).map(([english,hebrew])=>english+" = "+hebrew).join("   •   ");
 $("questionHebrew").textContent="בעברית: "+q[3];
 $("counter").textContent="שאלה "+(position+1)+" מתוך 6 | נכונות: "+score;
 $("bar").style.width=((position+1)/6*100)+"%";
 $("question").textContent=q[0];$("answers").innerHTML="";
 $("status").textContent="";$("next").style.display="none";
 q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=["A. ","B. ","C. ","D. "][i]+o;b.onclick=()=>{
 if(locked)return;locked=true;
 [...$("answers").children].forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("good")});
 if(i===q[2]){score++;b.classList.add("good");$("status").textContent="כל הכבוד! תשובה נכונה."}
 else{b.classList.add("bad");$("status").textContent="לא נכון. התשובה היא: "+q[1][q[2]]}
 $("next").style.display="block";$("next").textContent=position===5?"הצג את הציון":"לשאלה הבאה ←";
 };$("answers").appendChild(b)});
}
function begin(){pickedSet=chooseSet();score=0;position=0;show()}
$("next").onclick=()=>{position++;if(position<6)show();else{
 const pct=Math.round(score/6*100);const main=document.querySelector("main");main.innerHTML="";
 const panel=document.createElement("section");panel.className="panel";panel.style.textAlign="center";
 panel.innerHTML="<h2>סיימת קטע קריאה!</h2><div class='scorebig'>"+pct+"/100</div><p>ענית נכון על "+score+" מתוך 6 שאלות.</p>";
 const again=document.createElement("button");again.className="next";again.style.display="inline-block";again.textContent="📖 קטע קריאה חדש";again.onclick=()=>location.reload();
 const mistakes=document.createElement("a");mistakes.href="studyai-review.html?subject=english";mistakes.className="next";mistakes.style.cssText="display:inline-block;margin:10px;text-decoration:none";mistakes.textContent="🎯 תרגל את הטעויות באנגלית";
 panel.append(again,mistakes);main.append(panel)
}};
begin();
