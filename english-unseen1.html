<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Unseen — מבחן 1 באנגלית | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial}.back{position:fixed;left:12px;top:12px;z-index:3000;background:#fff;color:#162e67;text-decoration:none;padding:11px 14px;border-radius:13px;font-weight:900;box-shadow:0 5px 18px #10265026;border:2px solid #dce5f5}header{background:#162e67;color:#fff;padding:20px 5%;text-align:center}main{max-width:920px;margin:24px auto;padding:0 14px}.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #172f6512;margin:16px 0}.passage{direction:ltr;text-align:left;line-height:1.8;font-size:19px;background:#f8faff;border:2px solid #dce5f5;border-radius:16px;padding:18px}.question{font-size:22px;font-weight:900;margin:8px 0 16px;direction:ltr;text-align:left}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{font:inherit;padding:15px;border-radius:14px;border:2px solid #dce5f5;background:#f8faff;font-weight:800;cursor:pointer;direction:ltr;text-align:left}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.status{font-weight:900;min-height:30px;margin:15px 0}.next{display:none;margin:auto;background:#315bd7;color:#fff;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:900}.muted{color:#66758b}.progress{height:10px;background:#e4eaf6;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:#315bd7;width:0}.passage-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.passage-title strong{font-size:20px}.scorebig{font-size:38px;font-weight:900;color:#183d91}@media(max-width:650px){.answers{grid-template-columns:1fr}.back{font-size:12px;padding:8px 9px}.passage{font-size:17px}.panel{padding:18px}.passage-title{display:block}}</style></head><body><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a><header><strong>📖 Unseen — תרגול מלא למבחן</strong></header><main><section class="panel"><div class="passage-title"><strong id="passageName"></strong><span class="muted">קרא את הקטע ואז ענה על השאלות</span></div><div id="passage" class="passage"></div></section><section class="panel"><p id="counter" class="muted"></p><div class="progress"><div id="bar"></div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">שאלה הבאה ←</button></section></main><script>const sets=[{"title":"1 — Max the Dog","text":"Maya has a small brown dog. His name is Max. Every morning, Maya takes Max to the park. Max likes to play with a red ball. On Monday, Maya meets her friend Tom. Tom gives Max some water. After one hour, they go home. Max is tired but happy.","qs":[["What animal does Maya have?",["A cat","A dog","A bird","A fish"],1],["What is the dog's name?",["Sam","Ben","Max","Ron"],2],["Where do they go?",["To the park","To school","To the shop","To the zoo"],0],["What color is the ball?",["Blue","Green","Red","Yellow"],2],["Who gives Max water?",["Ben","Tom","Dan","Leo"],1],["How does Max feel at the end?",["Angry","Sad","Hungry","Tired but happy"],3]]},{"title":"2 — At School","text":"Ben is in class seven. His school starts at eight o'clock. On Tuesday, he has English first. In English class, the students read a short story. At ten o'clock, Ben eats a sandwich with his friend Noa. After lunch, they have science. They learn about water. Ben goes home at two o'clock.","qs":[["What class is Ben in?",["Class five","Class six","Class seven","Class eight"],2],["What time does school start?",["At seven","At eight","At nine","At ten"],1],["What lesson is first?",["English","Math","Art","Music"],0],["What do the students read?",["A letter","A song","A short story","A list"],2],["Who eats with Ben?",["Noa","Tom","Maya","Ella"],0],["What do they learn about in science?",["Space","Animals","Trees","Water"],3]]},{"title":"3 — Ella's Birthday","text":"Ella is twelve years old today. Her family has a party at home. Her mother makes a chocolate cake. Her brother puts blue balloons in the living room. At five o'clock, Ella's friends arrive. They play games and listen to music. Ella opens her gifts after dinner. Her favorite gift is a new book. She loves reading.","qs":[["How old is Ella?",["Ten","Eleven","Twelve","Thirteen"],2],["Where is the party?",["At home","At school","At a park","At a shop"],0],["What cake does her mother make?",["Apple","Chocolate","Lemon","Vanilla"],1],["What color are the balloons?",["Red","Yellow","Green","Blue"],3],["When do the friends arrive?",["At three","At four","At five","At six"],2],["What is Ella's favorite gift?",["A ball","A bike","A book","A bag"],2]]},{"title":"4 — The Beach","text":"It is a hot Saturday. Adam goes to the beach with his family. They take water, fruit, and sandwiches. Adam plays in the sand with his little sister. His father swims in the sea. At twelve o'clock, the family eats lunch under a big umbrella. Later, Adam takes photos of the sea. They go home at four o'clock.","qs":[["What day is it?",["Monday","Wednesday","Saturday","Sunday"],2],["Where does Adam go?",["To the beach","To the zoo","To school","To a shop"],0],["Who plays with Adam?",["His teacher","His little sister","His friend","His father"],1],["What does his father do?",["Reads","Runs","Sleeps","Swims"],3],["Where do they eat lunch?",["At school","On a bus","Under an umbrella","In a shop"],2],["What does Adam take photos of?",["The sea","A dog","A train","A house"],0]]},{"title":"5 — The Garden","text":"Our school has a small garden. Every Wednesday, our class works there. We grow tomatoes and carrots. The teacher gives us water for the plants. My friend Dana likes the red tomatoes. I like the carrots. In the morning, we clean the garden. In the afternoon, we put the vegetables in a box. We are happy.","qs":[["What does the school have?",["A pool","A garden","A shop","A farm"],1],["When does the class work there?",["Monday","Tuesday","Wednesday","Friday"],2],["What do they grow?",["Tomatoes and carrots","Potatoes and onions","Flowers only","Apples and pears"],0],["Who gives water?",["The teacher","The driver","The cook","The doctor"],0],["What does Dana like?",["Potatoes","Carrots","Tomatoes","Onions"],2],["Where do they put the vegetables?",["In a bag","In a car","On the floor","In a box"],3]]},{"title":"6 — A New Friend","text":"Leo is new at school. On his first day, he sits next to Ron. Ron smiles and says hello. At lunch, Ron asks Leo to sit with his friends. They eat pizza and talk about football. Leo likes football too. After school, the boys play football in the park. Leo is happy because he has a new friend.","qs":[["Who is new at school?",["Ron","Leo","Ben","Tom"],1],["Who sits next to Leo?",["Ron","Maya","Dana","Ella"],0],["What do the boys eat?",["Rice","Soup","Pizza","Pasta"],2],["What sport do they like?",["Tennis","Football","Basketball","Swimming"],1],["Where do they play?",["At the beach","At the library","In a classroom","In the park"],3],["Why is Leo happy?",["He has a friend","He has a dog","He won a prize","He has a bike"],0]]},{"title":"7 — A Family Trip","text":"On Friday, Sara and her parents go on a trip. They travel by car. First, they visit an old house. Then they walk to a river. Sara takes many photos. At one o'clock, they eat lunch at a restaurant. Sara has pasta and her father has a salad. In the evening, they drive home.","qs":[["When do they go?",["Friday","Monday","Tuesday","Thursday"],0],["How do they travel?",["By bus","By train","By car","By bike"],2],["What do they visit first?",["A school","An old house","A zoo","A market"],1],["What does Sara take?",["Books","Flowers","Toys","Photos"],3],["Where do they eat lunch?",["At a restaurant","At home","At school","On a bus"],0],["What does Sara eat?",["Soup","Pizza","Pasta","Rice"],2]]},{"title":"8 — My Book","text":"Dan loves reading books. His favorite book is about a boy and his dog. The boy lives in a small village. Every day, he walks with his dog near a river. One day, they find a lost cat. They take the cat home and give it food. The cat is happy. Dan reads this book every summer.","qs":[["What does Dan love?",["Cooking","Reading","Swimming","Drawing"],1],["Who is the book about?",["A girl and a horse","A teacher","A boy and a dog","A family trip"],2],["Where does the boy live?",["In a village","In a city","At school","At the beach"],0],["Where does the boy walk?",["Near a shop","Near a river","Near a museum","Near a hospital"],1],["What animal do they find?",["A bird","A dog","A fish","A cat"],3],["What do they give the cat?",["A ball","A toy","Food","A book"],2]]},{"title":"9 — Football","text":"Every Sunday, Tom plays football with his friends. They play in a park near his home. Tom has a green football shirt. His best friend is Ben. Ben is a good player. Today, Tom's team wins the game. They are very happy. After the game, the boys drink water and go to Ben's house.","qs":[["When does Tom play?",["Sunday","Tuesday","Friday","Saturday"],0],["Where do they play?",["At school","At the beach","In a park","In a gym"],2],["What color is Tom's shirt?",["Red","Green","Blue","Black"],1],["Who is Tom's best friend?",["Dan","Leo","Ron","Ben"],3],["What happens today?",["Tom's team wins","Tom stays home","It rains","Ben loses his ball"],0],["What do they drink?",["Milk","Juice","Water","Tea"],2]]},{"title":"10 — At the Market","text":"Mia goes to the market with her mother on Saturday. They buy food for dinner. First, they buy red apples and yellow bananas. Then they buy tomatoes and bread. Mia sees a small dog near a shop. The dog is friendly. Before they go home, Mia's mother buys orange juice. Mia helps carry the bags.","qs":[["Who goes with Mia?",["Her father","Her mother","Her teacher","Her friend"],1],["When do they go?",["Saturday","Sunday","Friday","Monday"],0],["What color are the apples?",["Green","Yellow","Red","Blue"],2],["What do they buy after the fruit?",["Milk and rice","Fish and eggs","Cake and water","Tomatoes and bread"],3],["What animal does Mia see?",["A cat","A dog","A bird","A horse"],1],["What does Mia carry?",["The bags","The dog","The chairs","The books"],0]]},{"title":"11 — Rainy Day","text":"It is raining today, so Lily stays at home. She wants to go to the park, but the weather is bad. In the morning, Lily draws a yellow sun. After lunch, she calls her friend Emma. They talk for twenty minutes. In the afternoon, Lily helps her father make cookies. The cookies are very good.","qs":[["What is the weather like?",["Sunny","Snowy","Rainy","Hot"],2],["Where is Lily?",["At home","At school","In the park","At the beach"],0],["What does Lily draw?",["A cat","A yellow sun","A house","A red car"],1],["Who does she call?",["Her teacher","Her mother","Her brother","Emma"],3],["How long do they talk?",["Ten minutes","Twenty minutes","One hour","Five minutes"],1],["What do they make?",["Soup","Pizza","Cookies","Bread"],2]]},{"title":"12 — The Library","text":"Noa goes to the library every Thursday. She likes books about animals. Today, she wants a book about dolphins. The librarian shows her a blue book with many pictures. Noa sits by the window and reads for thirty minutes. Then she puts the book in her bag and walks home. She wants to show the pictures to her little brother.","qs":[["When does Noa go to the library?",["Monday","Tuesday","Thursday","Saturday"],2],["What books does she like?",["Cars","Animals","Sports","Music"],1],["What animal is today's book about?",["Dolphins","Lions","Dogs","Birds"],0],["What color is the book?",["Red","Green","Yellow","Blue"],3],["Where does Noa sit?",["By the window","Near the door","On the floor","Outside"],0],["Who will see the pictures?",["Her teacher","Her mother","Her little brother","Her friend"],2]]},{"title":"13 — Bike Ride","text":"It is Sunday afternoon. Eitan rides his bike with his sister, Yael. They go to a park near their house. Eitan has a black bike, and Yael has a pink bike. They ride for thirty minutes and stop to drink water. In the park, they see their friend Roy. The three children play together. At six o'clock, they go home.","qs":[["What day is it?",["Sunday","Friday","Tuesday","Wednesday"],0],["Who rides with Eitan?",["His father","His sister","His brother","His friend"],1],["Where do they go?",["To school","To a market","To a park","To the beach"],2],["What color is Yael's bike?",["Black","Blue","Green","Pink"],3],["What do they drink?",["Milk","Water","Juice","Tea"],1],["When do they go home?",["At four","At five","At six","At seven"],2]]}];

sets.forEach(s=>s.qs=s.qs.slice(0,6));
const $=id=>document.getElementById(id);
const deckKey="studyai_unseen_deck_v2_"+(localStorage.getItem("studyai_active_v1")||"guest");
let score=0,position=0,locked=false,pickedSet=-1;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseSet(){
 let state;try{state=JSON.parse(localStorage.getItem(deckKey)||"null")}catch(e){}
 const n=sets.length;
 if(!state||!Array.isArray(state.deck)||state.deck.length!==n||new Set(state.deck).size!==n||state.deck.some(x=>!Number.isInteger(x)||x<0||x>=n))state={deck:shuffle([...sets.keys()]),used:0,last:-1};
 if(state.used>=n){state.deck=shuffle([...sets.keys()]);if(n>1&&state.deck[0]===state.last)[state.deck[0],state.deck[1]]=[state.deck[1],state.deck[0]];state.used=0}
 const idx=state.deck[state.used++];state.last=idx;
 try{localStorage.setItem(deckKey,JSON.stringify(state))}catch(e){}
 return idx
}
function show(){
 locked=false;
 const set=sets[pickedSet],q=set.qs[position];
 $("passageName").textContent=set.title;
 $("passage").innerHTML=set.text;
 $("counter").textContent="שאלה "+(position+1)+" מתוך 6 | נכונות: "+score;
 $("bar").style.width=((position+1)/6*100)+"%";
 $("question").textContent=q[0];$("answers").innerHTML="";
 $("status").textContent="";$("next").style.display="none";
 q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=["A. ","B. ","C. ","D. "][i]+o;b.onclick=()=>{
 if(locked)return;locked=true;
 [...$("answers").children].forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("good")});
 if(i===q[2]){score++;b.classList.add("good");$("status").textContent="כל הכבוד! תשובה נכונה."}
 else{b.classList.add("bad");$("status").textContent="לא נכון. התשובה היא: "+q[1][q[2]]}
 $("next").style.display="block";$("next").textContent=position===5?"הצג את הציון":"לשאלה הבאה ←";
 };$("answers").appendChild(b)});
}
function begin(){pickedSet=chooseSet();score=0;position=0;show()}
$("next").onclick=()=>{position++;if(position<6)show();else{
 const pct=Math.round(score/6*100);const main=document.querySelector("main");main.innerHTML="";
 const panel=document.createElement("section");panel.className="panel";panel.style.textAlign="center";
 panel.innerHTML="<h2>סיימת קטע קריאה!</h2><div class='scorebig'>"+pct+"/100</div><p>ענית נכון על "+score+" מתוך 6 שאלות.</p>";
 const again=document.createElement("button");again.className="next";again.style.display="inline-block";again.textContent="📖 קטע קריאה חדש";again.onclick=()=>location.reload();
 const mistakes=document.createElement("a");mistakes.href="studyai-review.html?subject=english";mistakes.className="next";mistakes.style.cssText="display:inline-block;margin:10px;text-decoration:none";mistakes.textContent="🎯 תרגל את הטעויות באנגלית";
 panel.append(again,mistakes);main.append(panel)
}};
begin();
</script></body></html>
