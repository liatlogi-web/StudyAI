<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Unseen — מבחן 1 באנגלית | StudyAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#17294d;font:17px system-ui,Arial}.back{position:fixed;left:12px;top:12px;z-index:3000;background:#fff;color:#162e67;text-decoration:none;padding:11px 14px;border-radius:13px;font-weight:900;box-shadow:0 5px 18px #10265026;border:2px solid #dce5f5}header{background:#162e67;color:#fff;padding:20px 5%;text-align:center}main{max-width:920px;margin:24px auto;padding:0 14px}.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px #172f6512;margin:16px 0}.passage{direction:ltr;text-align:left;line-height:1.8;font-size:19px;background:#f8faff;border:2px solid #dce5f5;border-radius:16px;padding:18px}.question{font-size:22px;font-weight:900;margin:8px 0 16px;direction:ltr;text-align:left}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{font:inherit;padding:15px;border-radius:14px;border:2px solid #dce5f5;background:#f8faff;font-weight:800;cursor:pointer;direction:ltr;text-align:left}.answer.good{background:#e7fff1;border-color:#15935c}.answer.bad{background:#fff0f0;border-color:#c74040}.status{font-weight:900;min-height:30px;margin:15px 0}.next{display:none;margin:auto;background:#315bd7;color:#fff;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:900}.muted{color:#66758b}.progress{height:10px;background:#e4eaf6;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:#315bd7;width:0}.passage-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.passage-title strong{font-size:20px}.scorebig{font-size:38px;font-weight:900;color:#183d91}@media(max-width:650px){.answers{grid-template-columns:1fr}.back{font-size:12px;padding:8px 9px}.passage{font-size:17px}.panel{padding:18px}.passage-title{display:block}}</style></head><body><a class="back" href="english-exam1.html">חזרה למבחן 1 באנגלית ←</a><header><strong>📖 Unseen — תרגול מלא למבחן</strong></header><main><section class="panel"><div class="passage-title"><strong id="passageName"></strong><span class="muted">קרא את הקטע ואז ענה על השאלות</span></div><div id="passage" class="passage"></div></section><section class="panel"><p id="counter" class="muted"></p><div class="progress"><div id="bar"></div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="status" class="status"></div><button id="next" class="next">שאלה הבאה ←</button></section></main><script>const sets=[
{title:'Unseen 1 — A Visit to a Village',text:`Last summer, Maya and her family visited a small village near a wide river. On the first day, they met a local guide named Sam. He showed them an old bridge and told them about the history of the area. Maya was surprised to learn that people had used the bridge for more than one hundred years.<br><br>The next morning, the family joined a walking tour. The weather was warm, but the path was sometimes dangerous, so Sam asked everyone to be careful. During the walk, Maya saw unusual birds and took many photos. At lunchtime, the group stopped near the river and ate a simple meal together.<br><br>At the end of the trip, Maya said that the village was one of the most interesting places she had ever visited. She hoped to return there one day.`,qs:[['Where did Maya and her family go?',['To a big city','To a small village near a river','To the mountains only','To a theater'],1],['Who was Sam?',['A teacher','Maya’s brother','A local guide','A bus driver'],2],['What did Sam show the family on the first day?',['An old bridge','A new school','A museum','A sports club'],0],['Why did Sam ask everyone to be careful?',['The path was sometimes dangerous','It was very cold','They were late','There were no guides'],0],['What did Maya see during the walking tour?',['Unusual birds','Snow','A football match','A train'],0],['Where did the group eat lunch?',['Near the river','At Maya’s home','At school','Inside a theater'],0],['How did Maya feel about the village?',['She thought it was boring','She thought it was very interesting','She was angry','She forgot it'],1],['What does “local” mean?',['From that area','Very expensive','Dangerous','Impossible'],0],['What does “return” mean?',['To come back','To open','To choose','To receive'],0],['Which sentence is TRUE?',['The bridge was new','Maya took many photos','The weather was cold','They did not eat lunch'],1]]},
{title:'Unseen 2 — The School Club',text:`Daniel wanted to try something new after school, so he looked at the list of clubs on the school website. There were many choices: a sports club, a theater club, a science club and a writing club. Daniel enjoyed stories and often wrote short texts at home, so he decided to join the writing club.<br><br>At the first meeting, the teacher asked every student to fill in a form. The students wrote their names, ages and favorite kinds of stories. Then they worked in small teams and created the beginning of a mystery story. Daniel was nervous at first, but the other students were friendly and helpful.<br><br>After the meeting, Daniel told his mother that he was happy with his choice. He planned to attend the club every Wednesday.`,qs:[['Why did Daniel look at the club list?',['He wanted to try something new','He lost his homework','His mother told him to leave school','He wanted lunch'],0],['Which club did Daniel choose?',['Sports','Theater','Writing','Science'],2],['Why did he choose that club?',['He liked stories and writing','He hated reading','His friend forced him','It was the only club'],0],['What did students do first?',['Played football','Filled in a form','Went home','Watched a movie'],1],['What information did they write?',['Names, ages and favorite kinds of stories','Only phone numbers','Test scores','Addresses only'],0],['How did Daniel feel at first?',['Nervous','Angry','Bored','Sleepy'],0],['How were the other students?',['Friendly and helpful','Quiet and rude','Late','Dangerous'],0],['What does “choice” mean in the last paragraph?',['Decision','Journey','Office','Meal'],0],['When did Daniel plan to attend?',['Every Monday','Every Wednesday','Every Friday','Every day'],1],['Which sentence is TRUE?',['Daniel joined a sports club','Daniel wrote short texts at home','The students worked alone','Daniel disliked the meeting'],1]]},
{title:'Unseen 3 — A Family Meal',text:`On Friday evening, Lina’s family prepared a special meal for her grandmother’s birthday. Lina helped her father in the kitchen. First, they cut vegetables and put them in a large bowl. Then her father added oil, salt and pepper. Lina’s brother made fresh lemonade.<br><br>When the grandmother arrived, everyone welcomed her warmly. She was amazed by the decorated table and the food. During dinner, the family talked about old memories and laughed together. After the main meal, Lina brought out a chocolate cake with candles.<br><br>Her grandmother thanked everyone and said it was a lovely evening. Lina realized that the best part of the celebration was not the food, but spending time together.`,qs:[['Why did the family prepare a special meal?',['For a birthday','For a school test','For a club meeting','For a trip'],0],['Who helped Lina in the kitchen?',['Her teacher','Her father','Her guide','Her friend'],1],['What did they put in the bowl?',['Vegetables','Books','Cake','Lemons only'],0],['What did Lina’s brother make?',['Coffee','Soup','Lemonade','Bread'],2],['How did the family welcome the grandmother?',['Warmly','Sadly','Quietly','Angrily'],0],['Why was the grandmother amazed?',['Because of the decorated table and food','Because it was snowing','Because nobody was home','Because dinner was late'],0],['What happened after the main meal?',['They left','Lina brought out a cake','They went to school','They cooked again'],1],['What does “lovely” mean?',['Pleasant and nice','Dangerous','Impossible','Wide'],0],['What did Lina realize?',['Food was the only important thing','Spending time together was the best part','Birthdays are boring','She dislikes cooking'],1],['Which sentence is TRUE?',['The grandmother cooked alone','They used salt and pepper','There was no dessert','Nobody talked during dinner'],1]]}
,{"title":"The Lost Backpack","text":"On Monday morning, Amir arrived at school early. He put his blue backpack next to the classroom door and went to get some water. When he returned, the backpack was gone. Amir was worried because his science project was inside.<br><br>His friend Ella suggested asking the school office for help. A teacher remembered seeing a blue backpack near the library. Amir and Ella walked there and found it on a chair. Another student had moved it while cleaning the hallway.<br><br>Amir thanked everyone. From that day, he always put his backpack inside the classroom before leaving.","qs":[["Why was Amir worried?",["His science project was in the backpack","He missed the bus","His lunch was cold","His friend was absent"],0],["Where did Amir first leave his backpack?",["At home","Next to the classroom door","In the library","On the bus"],1],["Who suggested asking the office?",["Ella","A bus driver","His brother","The librarian"],0],["Where was the backpack found?",["On a chair near the library","Under his bed","In the playground","Inside the office"],0],["Why had the backpack been moved?",["Someone was cleaning the hallway","A student wanted to steal it","It was raining","A teacher needed a bag"],0],["What did Amir learn?",["To leave early","To put his bag inside the classroom","To avoid science","To bring two bags"],1]]},{"title":"The School Garden","text":"Students at Green Hill School wanted to make their playground more beautiful. Their science teacher, Mrs. Cohen, suggested starting a small garden. At first, the students were not sure they could grow anything because the ground was dry.<br><br>Every Tuesday, one team worked in the garden. They planted tomatoes, flowers and herbs. They also collected rainwater in a large container. After six weeks, the first flowers appeared.<br><br>The students were proud of their work. They decided to give some tomatoes to the school kitchen and use the herbs to make fresh tea.","qs":[["What did the students want to improve?",["The playground","The library","The gym","The classroom"],0],["Who suggested a garden?",["The principal","Mrs. Cohen","A gardener","A parent"],1],["Why were the students unsure at first?",["The ground was dry","They had no teacher","It was winter","The seeds were expensive"],0],["When did teams work in the garden?",["Every Monday","Every day","Every Tuesday","Every Friday"],2],["What did they collect in a container?",["Tomatoes","Rainwater","Sand","Books"],1],["What did they do with some tomatoes?",["Gave them to the school kitchen","Sold them online","Left them in the garden","Took them to a museum"],0]]},{"title":"A Surprise for Grandpa","text":"Noa’s grandfather was turning seventy on Sunday. Noa wanted to give him something special, but she did not have much money. She remembered that Grandpa loved looking at old family photos.<br><br>Noa asked her cousins to send pictures from family trips and holidays. On Saturday, she printed the photos and put them in a small album. She wrote a short note under each picture.<br><br>At the birthday meal, Grandpa opened the album slowly. He smiled and told everyone a story about one of the photos. Noa realized that a thoughtful gift did not have to be expensive.","qs":[["How old was Grandpa turning?",["Sixty","Seventy","Eighty","Fifty"],1],["What did Grandpa enjoy?",["Old family photos","Football games","Cooking shows","Science experiments"],0],["Who sent Noa pictures?",["Her cousins","Her teachers","Her neighbors","Her classmates"],0],["What did Noa write under the photos?",["Short notes","Prices","Addresses","Questions"],0],["How did Grandpa react?",["He smiled and told a story","He was angry","He left the room","He lost the album"],0],["What did Noa learn?",["Good gifts must cost a lot","A thoughtful gift can be inexpensive","Photos are always boring","Birthdays are not important"],1]]},{"title":"The New Student","text":"A new student named Leo joined Dana’s class in October. He had moved from another city and did not know anyone at school. At lunchtime, Leo sat alone and looked at his phone.<br><br>Dana invited him to sit with her friends. They talked about music and their favorite sports. Leo said he liked basketball, so Dana told him about the school team. The next afternoon, Leo went to watch a practice.<br><br>A week later, Leo was smiling more and had made several friends. He thanked Dana for making his first days easier.","qs":[["Why was Leo new at school?",["He moved from another city","He changed his name","He missed a test","He joined the teachers"],0],["What did Leo do at lunchtime?",["Played football","Sat alone","Went home","Read a library book"],1],["Who invited Leo to join friends?",["Dana","The principal","A coach","His brother"],0],["Which sport did Leo like?",["Tennis","Swimming","Basketball","Running"],2],["What did Leo watch the next afternoon?",["A concert","A basketball practice","A movie","A science show"],1],["How did Leo feel a week later?",["Happier and more comfortable","Angry","Very bored","Worried about moving"],0]]},{"title":"A Day at the Museum","text":"Last Thursday, Tom’s class visited a science museum. The students traveled by bus and arrived at ten o’clock. Their guide gave each team a list of things to find.<br><br>Tom’s favorite room was about space. He saw a model of the Moon and learned why astronauts need special clothes. Later, his team tried a machine that showed how wind can move objects.<br><br>Before going home, the class took a group photo outside the museum. Tom said he wanted to return with his younger sister because she loved science too.","qs":[["Where did Tom's class go?",["A science museum","A theater","A farm","A shopping center"],0],["How did they travel?",["By train","By bus","By boat","On bicycles"],1],["When did they arrive?",["At eight","At nine","At ten","At twelve"],2],["Which room was Tom's favorite?",["The space room","The history room","The music room","The art room"],0],["What did the wind machine show?",["How to cook a meal","How wind moves objects","How flowers grow","How to write a story"],1],["Who did Tom want to return with?",["His younger sister","His teacher","His grandfather","His cousin"],0]]},{"title":"The Weekend Market","text":"Every Saturday, Mia helps her mother at a small market in their town. They sell fresh fruit, vegetables and homemade bread. Mia usually arranges the apples and writes the prices on colorful cards.<br><br>One morning, a customer asked for something healthy to take on a trip. Mia suggested a bag of apples and some bread. The customer thanked her and said the food would be perfect.<br><br>At the end of the day, Mia helped clean the table. She was tired but happy because she had learned how to speak confidently to customers.","qs":[["When does Mia help at the market?",["Every Saturday","Every Wednesday","Every Sunday","Every Monday"],0],["What does Mia usually arrange?",["The apples","The books","The shoes","The toys"],0],["What did the customer need food for?",["A school test","A trip","A party","A restaurant"],1],["What did Mia suggest?",["Chocolate and cake","Apples and bread","Only water","Soup and rice"],1],["What did Mia do at the end of the day?",["Helped clean the table","Went to school","Bought a bicycle","Played basketball"],0],["What skill did Mia improve?",["Speaking to customers","Swimming","Painting","Driving"],0]]},{"title":"The Rainy Football Match","text":"Eitan and his friends planned a football match for Friday afternoon. In the morning, the sun was shining, but by two o’clock, dark clouds covered the sky. Soon it began to rain heavily.<br><br>The children did not want to cancel their game. Their coach checked the field and explained that it was too wet and slippery. Instead, they went to the community center and played table tennis.<br><br>Although the afternoon was different from their plan, everyone had fun. Eitan discovered that trying a new sport could be exciting.","qs":[["What did the friends originally plan?",["A football match","A movie night","A birthday meal","A school trip"],0],["What changed in the afternoon?",["It became very hot","It started to rain heavily","It snowed","The sun disappeared for a week"],1],["Why couldn't they play on the field?",["It was too wet and slippery","It was too small","Nobody had a ball","The coach was away"],0],["Where did they go instead?",["The library","The community center","The market","A museum"],1],["Which sport did they play indoors?",["Swimming","Basketball","Table tennis","Volleyball"],2],["What did Eitan discover?",["New sports can be fun","Rain is always dangerous","Football is boring","He dislikes his friends"],0]]},{"title":"The Library Challenge","text":"At the beginning of November, the town library started a reading challenge for students. Anyone who read four books in one month could receive a small prize. Roni loved stories, but she usually read very slowly.<br><br>She decided to read fifteen minutes before bed every evening. After two weeks, she had finished her first two books. Her friend Ben recommended a mystery story, and Roni enjoyed it so much that she finished it in three days.<br><br>By the end of the month, Roni had read four books. She was proud not because of the prize, but because reading had become a new habit.","qs":[["Where did the challenge take place?",["At the town library","At a sports club","At a restaurant","At a museum"],0],["How many books were needed for a prize?",["Two","Three","Four","Six"],2],["When did Roni decide to read?",["Before bed","During lunch","Only on Sundays","On the bus"],0],["What kind of book did Ben recommend?",["A science textbook","A mystery story","A cookbook","A sports magazine"],1],["How long did the mystery book take Roni?",["One week","Three days","One month","Two weeks"],1],["Why was Roni most proud?",["Reading became a habit","She won a big prize","She read faster than Ben","She bought new books"],0]]},{"title":"The Class Picnic","text":"Class 7B planned a picnic in a park near their school. Each student had a different job. Some brought fruit, others prepared sandwiches, and two students brought a large blanket. Their teacher asked everyone to help keep the park clean.<br><br>When they arrived, the students played games under the trees. After lunch, they noticed some empty bottles on the grass. Although the bottles were not theirs, they collected them and put them in a recycling bin.<br><br>Before leaving, the teacher thanked the class. She said their teamwork had made the day enjoyable and had helped protect the environment.","qs":[["Where was the picnic?",["In a park near school","At a beach","In a museum","At a sports hall"],0],["What did two students bring?",["A large blanket","A bicycle","A football trophy","A tent"],0],["What did the teacher ask?",["To keep the park clean","To arrive late","To stay inside","To buy snacks"],0],["What did the class find after lunch?",["Empty bottles","Old books","Lost keys","New flowers"],0],["Where did they put the bottles?",["In a recycling bin","In their bags","Under a tree","On a table"],0],["What did the teacher praise?",["Their teamwork","Their test scores","Their uniforms","Their drawings"],0]]},{"title":"The Broken Bicycle","text":"On his way to school, Yonatan noticed that the chain on his bicycle had fallen off. He stopped next to a small shop and tried to fix it, but he did not know how. A woman who worked at the shop came outside and offered to help.<br><br>She showed Yonatan how to put the chain back in place and reminded him to check his bicycle before a long ride. Yonatan thanked her and continued to school.<br><br>That afternoon, he watched a short video about bicycle safety. He wanted to learn more so that next time he could solve the problem himself.","qs":[["What happened to Yonatan's bicycle?",["The chain fell off","A tire disappeared","The seat broke","The bell stopped working"],0],["Where did he stop?",["Next to a shop","At a bus station","Near a river","At the library"],0],["Who helped him?",["A woman from the shop","His science teacher","A police officer","His cousin"],0],["What did she show him?",["How to put the chain back","How to paint a bicycle","How to buy a new bike","How to ride faster"],0],["What did Yonatan watch later?",["A bicycle safety video","A football match","A cartoon","A music concert"],0],["Why did he want to learn more?",["To fix problems himself","To become a teacher","To stop going to school","To sell his bicycle"],0]]}];

sets.forEach(s=>s.qs=s.qs.slice(0,6));
const $=id=>document.getElementById(id);
const deckKey="studyai_unseen_deck_v2_"+(localStorage.getItem("studyai_active_v1")||"guest");
let score=0,position=0,locked=false,pickedSet=-1;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseSet(){
 let state;try{state=JSON.parse(localStorage.getItem(deckKey)||"null")}catch(e){}
 const n=sets.length;
 if(!state||!Array.isArray(state.deck)||state.deck.length!==n||new Set(state.deck).size!==n||state.deck.some(x=>!Number.isInteger(x)||x<0||x>=n))state={deck:shuffle([...sets.keys()]),used:0,last:-1};
 if(state.used>=n){state.deck=shuffle([...sets.keys()]);if(n>1&&state.deck[0]===state.last)[state.deck[0],state.deck[1]]=[state.deck[1],state.deck[0]];state.used=0}
 const idx=state.deck[state.used++];state.last=idx;
 try{localStorage.setItem(deckKey,JSON.stringify(state))}catch(e){}
 return idx
}
function show(){
 locked=false;
 const set=sets[pickedSet],q=set.qs[position];
 $("passageName").textContent=set.title;
 $("passage").innerHTML=set.text;
 $("counter").textContent="שאלה "+(position+1)+" מתוך 6 | נכונות: "+score;
 $("bar").style.width=((position+1)/6*100)+"%";
 $("question").textContent=q[0];$("answers").innerHTML="";
 $("status").textContent="";$("next").style.display="none";
 q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=["A. ","B. ","C. ","D. "][i]+o;b.onclick=()=>{
 if(locked)return;locked=true;
 [...$("answers").children].forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("good")});
 if(i===q[2]){score++;b.classList.add("good");$("status").textContent="כל הכבוד! תשובה נכונה."}
 else{b.classList.add("bad");$("status").textContent="לא נכון. התשובה היא: "+q[1][q[2]]}
 $("next").style.display="block";$("next").textContent=position===5?"הצג את הציון":"לשאלה הבאה ←";
 };$("answers").appendChild(b)});
}
function begin(){pickedSet=chooseSet();score=0;position=0;show()}
$("next").onclick=()=>{position++;if(position<6)show();else{
 const pct=Math.round(score/6*100);const main=document.querySelector("main");main.innerHTML="";
 const panel=document.createElement("section");panel.className="panel";panel.style.textAlign="center";
 panel.innerHTML="<h2>סיימת קטע קריאה!</h2><div class='scorebig'>"+pct+"/100</div><p>ענית נכון על "+score+" מתוך 6 שאלות.</p>";
 const again=document.createElement("button");again.className="next";again.style.display="inline-block";again.textContent="📖 קטע קריאה חדש";again.onclick=()=>location.reload();
 const mistakes=document.createElement("a");mistakes.href="studyai-review.html?subject=english";mistakes.className="next";mistakes.style.cssText="display:inline-block;margin:10px;text-decoration:none";mistakes.textContent="🎯 תרגל את הטעויות באנגלית";
 panel.append(again,mistakes);main.append(panel)
}};
begin();
</script></body></html>
